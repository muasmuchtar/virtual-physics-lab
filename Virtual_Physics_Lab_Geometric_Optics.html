<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometric Optics</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#06101d,#091827);color:#eef7ff}.app{max-width:1500px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{margin:0}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:310px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #24445f;border-radius:18px;overflow:hidden}.ch{padding:14px 16px;border-bottom:1px solid #24445f;font-weight:800}.cb{padding:15px}.ctrl{margin-bottom:14px}.ctrl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:#31d6c5;font-weight:800}input[type=range]{width:100%;accent-color:#31d6c5}select,button{background:#102b45;border:1px solid #315572;color:white;padding:9px 12px;border-radius:10px;cursor:pointer}select{width:100%}.sim{height:540px;position:relative;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}.badge{background:#06131ddd;border:1px solid #315572;padding:7px 9px;border-radius:9px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:11px;padding:10px}.stat small{display:block;color:#9db5cb}.stat strong{font-size:18px}.formula{margin-top:12px;border-left:3px solid #31d6c5;background:#081927;padding:11px;border-radius:9px;font-family:Consolas,monospace;line-height:1.6;font-size:12px}.chart{height:235px;margin-top:12px}.table{max-height:210px;overflow:auto;margin-top:12px;border:1px solid #24445f;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #1a354d;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:1100px){.grid{grid-template-columns:290px 1fr}.right{grid-column:1/-1}}@media(max-width:720px){.grid{grid-template-columns:1fr}.right{grid-column:auto}.head{flex-direction:column;align-items:flex-start}.sim{height:450px}}
</style></head><body><div class="app">
<div class="head"><div><h1>20 — Geometric Optics: Reflection & Refraction</h1><div class="sub">Law of Reflection • Snell's Law • Total Internal Reflection</div></div><button id="csv">Export CSV</button></div><div class="grid">
<section class="card"><div class="ch">Parameter</div><div class="cb">
<div class="ctrl"><label>Sudut datang θ₁ <span class="val" id="a1v"></span></label><input id="a1" type="range" min="0" max="85" value="40" step="1"></div>
<div class="ctrl"><label>Indeks bias n₁ <span class="val" id="n1v"></span></label><input id="n1" type="range" min="1" max="2.5" value="1" step=".01"></div>
<div class="ctrl"><label>Indeks bias n₂ <span class="val" id="n2v"></span></label><input id="n2" type="range" min="1" max="2.5" value="1.5" step=".01"></div>
<div class="ctrl"><label>Medium preset n₂</label><select id="preset"><option value="1.0003">Air</option><option value="1.333">Water</option><option value="1.5" selected>Glass</option><option value="2.42">Diamond</option></select></div></div></section>
<section class="card"><div class="ch">Ray Diagram</div><div class="sim"><canvas id="c"></canvas><div class="badges"><div class="badge">θr=<span id="ar"></span>°</div><div class="badge">θ₂=<span id="a2"></span></div><div class="badge"><span id="status"></span></div></div></div><div class="bar"><button id="animate">▶ Animate Ray</button><button id="record">＋ Record</button><button id="reset">↺ Reset</button></div></section>
<section class="card right"><div class="ch">Analisis</div><div class="cb"><div class="stats"><div class="stat"><small>Reflection angle</small><strong id="refl"></strong></div><div class="stat"><small>Refraction angle</small><strong id="refr"></strong></div><div class="stat"><small>Critical angle</small><strong id="crit"></strong></div><div class="stat"><small>Relative speed v₂/c</small><strong id="speed"></strong></div></div>
<div class="formula">θr = θ₁<br>n₁ sinθ₁ = n₂ sinθ₂<br>θc = asin(n₂/n₁), for n₁ &gt; n₂<br>v = c/n</div><div class="chart"><canvas id="g"></canvas></div>
<div class="table"><table><thead><tr><th>#</th><th>θ1</th><th>n1</th><th>n2</th><th>θ2</th></tr></thead><tbody id="tb"></tbody></table></div></div></section></div></div>
<script>
const $=i=>document.getElementById(i),c=$('c'),x=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let phase=1,rows=[];
function q(){let a1=+$('a1').value,n1=+$('n1').value,n2=+$('n2').value,s=n1*Math.sin(a1*Math.PI/180)/n2,tir=Math.abs(s)>1,a2=tir?null:Math.asin(s)*180/Math.PI,crit=n1>n2?Math.asin(n2/n1)*180/Math.PI:null;return{a1,n1,n2,a2,tir,crit}}
function resize(){let D=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*D;c.height=r.height*D;x.setTransform(D,0,0,D,0,0);r=g.getBoundingClientRect();g.width=r.width*D;g.height=r.height*D;gx.setTransform(D,0,0,D,0,0);draw();chart()}
function ray(x0,y0,ang,len,color){x.strokeStyle=color;x.lineWidth=4;x.beginPath();x.moveTo(x0,y0);x.lineTo(x0+Math.sin(ang)*len,y0+Math.cos(ang)*len);x.stroke()}
function draw(){let W=c.clientWidth,H=c.clientHeight,cx=W/2,cy=H/2,z=q(),a=z.a1*Math.PI/180;x.clearRect(0,0,W,H);x.fillStyle='#0c2940';x.fillRect(0,0,W,cy);x.fillStyle='#103e57';x.fillRect(0,cy,W,H-cy);x.strokeStyle='#dceaf5';x.beginPath();x.moveTo(0,cy);x.lineTo(W,cy);x.stroke();x.setLineDash([6,6]);x.beginPath();x.moveTo(cx,40);x.lineTo(cx,H-40);x.stroke();x.setLineDash([]);ray(cx,cy,Math.PI-a,220*phase,'#ffd166');ray(cx,cy,a,180*phase,'#ff758f');if(!z.tir)ray(cx,cy,z.a2*Math.PI/180,220*phase,'#31d6c5');$('ar').textContent=z.a1.toFixed(1);$('a2').textContent=z.tir?'—':z.a2.toFixed(1)+'°';$('status').textContent=z.tir?'TOTAL INTERNAL REFLECTION':'REFRACTION'}
function update(){let z=q();$('a1v').textContent=z.a1+'°';$('n1v').textContent=z.n1.toFixed(2);$('n2v').textContent=z.n2.toFixed(2);$('refl').textContent=z.a1.toFixed(1)+'°';$('refr').textContent=z.tir?'TIR':z.a2.toFixed(1)+'°';$('crit').textContent=z.crit===null?'—':z.crit.toFixed(1)+'°';$('speed').textContent=(1/z.n2).toFixed(3)+' c';draw();chart()}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=30,z=q();gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,10);gx.lineTo(p,H-p);gx.lineTo(W-10,H-p);gx.stroke();gx.strokeStyle='#31d6c5';gx.beginPath();let started=false;for(let a=0;a<=89;a++){let s=z.n1*Math.sin(a*Math.PI/180)/z.n2;if(s<=1){let b=Math.asin(s)*180/Math.PI,X=p+a/89*(W-p-12),Y=H-p-b/90*(H-p-18);if(started)gx.lineTo(X,Y);else{gx.moveTo(X,Y);started=true}}}gx.stroke()}
$('preset').onchange=()=>{$('n2').value=$('preset').value;update()};['a1','n1','n2'].forEach(i=>$(i).oninput=update);$('animate').onclick=()=>{phase=0;let st=performance.now();function f(n){phase=Math.min(1,(n-st)/700);draw();if(phase<1)requestAnimationFrame(f)}requestAnimationFrame(f)};$('reset').onclick=()=>{phase=1;$('a1').value=40;$('n1').value=1;$('n2').value=1.5;update()};
$('record').onclick=()=>{let z=q();rows.push(z);$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.a1}</td><td>${r.n1}</td><td>${r.n2}</td><td>${r.tir?'TIR':r.a2.toFixed(1)}</td></tr>`).join('')};
$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='No,theta1_deg,n1,n2,theta2_deg\n'+rows.map((r,i)=>[i+1,r.a1,r.n1,r.n2,r.tir?'TIR':r.a2].join(',')).join('\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='geometric_optics.csv';a.click()};
new ResizeObserver(resize).observe(document.body);update();
</script></body></html>
