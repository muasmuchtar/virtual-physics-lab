<!doctype html><html lang=id><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>PID Control</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#071525;color:#eef7ff}.app{max-width:1450px;margin:auto;padding:18px}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:300px 1fr 355px;gap:14px}.card{background:#0d2237;border:1px solid #29465f;border-radius:17px;overflow:hidden}.hd{padding:13px 15px;font-weight:800;border-bottom:1px solid #29465f}.p{padding:14px}.ctrl{margin-bottom:13px}.ctrl label{display:flex;justify-content:space-between;font-size:13px}.v{color:#31d6c5;font-weight:700}input{width:100%;accent-color:#31d6c5}button{background:#102b45;color:#fff;border:1px solid #315572;border-radius:9px;padding:9px 11px}.sim{height:500px;background:#081725;position:relative}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:11px;display:flex;gap:7px;flex-wrap:wrap}.badgebox{position:absolute;top:10px;left:10px;display:flex;gap:6px}.badge{background:#06131ddd;border:1px solid #315572;padding:7px;border-radius:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:9px;padding:9px}.stat small{display:block;color:#9db5cb}.formula{margin-top:10px;padding:10px;background:#081927;border-left:3px solid #31d6c5;border-radius:8px;font:12px Consolas;line-height:1.6}.chart{height:220px;margin-top:10px}.tbl{max-height:145px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}td,th{padding:6px;border-bottom:1px solid #24445f;text-align:right}@media(max-width:1050px){.grid{grid-template-columns:285px 1fr}.right{grid-column:1/-1}}@media(max-width:700px){.grid{grid-template-columns:1fr}.right{grid-column:auto}}</style></head><body><div class=app><h1>69 — PID Control & Closed-Loop Response</h1><div class=sub>Setpoint tracking • proportional-integral-derivative action • disturbance rejection • transient response</div><div class=grid><div class=card><div class=hd>Controller</div><div class=p>
<div class=ctrl><label>Setpoint <span class=v id=spv></span></label><input id=sp type=range min=0 max=100 value=70></div>
<div class=ctrl><label>Kp <span class=v id=kpv></span></label><input id=kp type=range min=0 max=8 value=2 step=.1></div>
<div class=ctrl><label>Ki <span class=v id=kiv></span></label><input id=ki type=range min=0 max=5 value=.8 step=.05></div>
<div class=ctrl><label>Kd <span class=v id=kdv></span></label><input id=kd type=range min=0 max=3 value=.25 step=.05></div>
<div class=ctrl><label>Plant time constant <span class=v id=tauv></span></label><input id=tau type=range min=.2 max=5 value=1.5 step=.1></div>
</div></div><div class=card><div class=hd>Closed-Loop Simulation</div><div class=sim><canvas id=c></canvas><div class=badgebox><span class=badge>PV: <b id=pvn></b></span><span class=badge>Control: <b id=un></b></span></div></div><div class=bar><button id=run>▶ Run</button><button id=pause>⏸ Pause</button><button id=dist>⚡ Disturbance</button><button id=reset>↺ Reset</button><button id=record>＋ Record</button><button id=csv>CSV</button></div></div><div class="card right"><div class=hd>Analysis</div><div class=p><div class=stats><div class=stat><small>Error</small><b id=ERR></b></div><div class=stat><small>P term</small><b id=PT></b></div><div class=stat><small>I term</small><b id=IT></b></div><div class=stat><small>D term</small><b id=DT></b></div></div><div class=formula>e = r − y<br>u = Kp·e + Ki∫e dt + Kd·de/dt<br>Plant: τ dy/dt + y = u</div><div class=chart><canvas id=g></canvas></div><div class=tbl><table><thead><tr><th>t</th><th>SP</th><th>PV</th><th>u</th></tr></thead><tbody id=tb></tbody></table></div></div></div></div></div><script>
const $=i=>document.getElementById(i),c=$('c'),x=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let active=true,y=0,integ=0,prev=0,t=0,last=performance.now(),hist=[],rows=[],kick=0,P=0,I=0,D=0,u=0;
function pars(){return{sp:+$('sp').value,kp:+$('kp').value,ki:+$('ki').value,kd:+$('kd').value,tau:+$('tau').value}}
function labels(){let z=pars();$('spv').textContent=z.sp;$('kpv').textContent=z.kp.toFixed(1);$('kiv').textContent=z.ki.toFixed(2);$('kdv').textContent=z.kd.toFixed(2);$('tauv').textContent=z.tau.toFixed(1)+' s';draw();chart()}
function step(dt){let z=pars(),e=z.sp-y;integ=Math.max(-200,Math.min(200,integ+e*dt));let der=(e-prev)/Math.max(dt,.001);P=z.kp*e;I=z.ki*integ;D=z.kd*der;u=Math.max(-100,Math.min(100,P+I+D));y+=(u-y+kick)/z.tau*dt;kick*=.97;prev=e;t+=dt;hist.push({t,sp:z.sp,y,u});if(hist.length>450)hist.shift()}
function size(){let d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);r=g.getBoundingClientRect();g.width=r.width*d;g.height=r.height*d;gx.setTransform(d,0,0,d,0,0);labels()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=pars();x.clearRect(0,0,W,H);x.strokeStyle='#29465f';for(let i=1;i<5;i++){x.beginPath();x.moveTo(35,i*H/5);x.lineTo(W-15,i*H/5);x.stroke()}function line(key,col){x.strokeStyle=col;x.lineWidth=2;x.beginPath();hist.forEach((p,i)=>{let X=35+i/449*(W-55),Y=H-30-p[key]/110*(H-60);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()}line('sp','#ffd166');line('y','#31d6c5');x.fillStyle='#eef7ff';x.fillText('Setpoint',40,22);x.fillStyle='#31d6c5';x.fillText('Process variable',110,22);$('pvn').textContent=y.toFixed(2);$('un').textContent=u.toFixed(2);$('ERR').textContent=(z.sp-y).toFixed(2);$('PT').textContent=P.toFixed(2);$('IT').textContent=I.toFixed(2);$('DT').textContent=D.toFixed(2)}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=28;gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,H/2);gx.lineTo(W-8,H/2);gx.stroke();gx.strokeStyle='#58a8ff';gx.beginPath();hist.forEach((h,i)=>{let X=p+i/449*(W-p-10),Y=H/2-h.u/110*(H*.42);i?gx.lineTo(X,Y):gx.moveTo(X,Y)});gx.stroke();gx.fillStyle='#eef7ff';gx.fillText('Controller output u(t)',p,13)}
function loop(n){let dt=Math.min((n-last)/1000,.03);last=n;if(active){step(dt);draw();chart()}requestAnimationFrame(loop)}
$('run').onclick=()=>active=true;$('pause').onclick=()=>active=false;$('dist').onclick=()=>kick=-50;$('reset').onclick=()=>{y=integ=prev=t=kick=0;hist=[];labels()};['sp','kp','ki','kd','tau'].forEach(i=>$(i).oninput=labels);$('record').onclick=()=>{rows.push({t,sp:pars().sp,y,u});$('tb').innerHTML=rows.map(r=>`<tr><td>${r.t.toFixed(2)}</td><td>${r.sp}</td><td>${r.y.toFixed(2)}</td><td>${r.u.toFixed(2)}</td></tr>`).join('')};$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='time_s,setpoint,PV,control\n'+rows.map(r=>[r.t,r.sp,r.y,r.u].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='pid_response.csv';a.click()};new ResizeObserver(size).observe(document.body);labels();requestAnimationFrame(loop)
</script></body></html>
