<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AC RLC Resonance</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#06101d,#091827);color:#eef7ff}.app{max-width:1500px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{margin:0}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:310px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #24445f;border-radius:18px;overflow:hidden}.ch{padding:14px 16px;border-bottom:1px solid #24445f;font-weight:800}.cb{padding:15px}.ctrl{margin-bottom:14px}.ctrl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:#31d6c5;font-weight:800}input[type=range]{width:100%;accent-color:#31d6c5}button{background:#102b45;border:1px solid #315572;color:white;padding:9px 12px;border-radius:10px;cursor:pointer}.sim{height:540px;position:relative;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}.badge{background:#06131ddd;border:1px solid #315572;padding:7px 9px;border-radius:9px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:11px;padding:10px}.stat small{display:block;color:#9db5cb}.stat strong{font-size:18px}.formula{margin-top:12px;border-left:3px solid #31d6c5;background:#081927;padding:11px;border-radius:9px;font-family:Consolas,monospace;line-height:1.6;font-size:12px}.chart{height:235px;margin-top:12px}.table{max-height:210px;overflow:auto;margin-top:12px;border:1px solid #24445f;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #1a354d;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:1100px){.grid{grid-template-columns:290px 1fr}.right{grid-column:1/-1}}@media(max-width:720px){.grid{grid-template-columns:1fr}.right{grid-column:auto}.head{flex-direction:column;align-items:flex-start}.sim{height:450px}}</style></head><body><div class="app">
<div class="head"><div><h1>27 — AC Circuits & RLC Resonance</h1><div class="sub">Impedance • Phase • Resonance • Power Factor</div></div><button id="csv">Export CSV</button></div><div class="grid">
<section class="card"><div class="ch">Parameter</div><div class="cb">
<div class="ctrl"><label>Vrms <span class="val" id="Vv"></span></label><input id="V" type="range" min="1" max="240" value="120" step="1"></div>
<div class="ctrl"><label>R <span class="val" id="Rv"></span></label><input id="R" type="range" min="1" max="200" value="40" step="1"></div>
<div class="ctrl"><label>L <span class="val" id="Lv"></span></label><input id="L" type="range" min=".01" max="1" value=".2" step=".01"></div>
<div class="ctrl"><label>C <span class="val" id="Cv"></span></label><input id="C" type="range" min="1" max="500" value="50" step="1"></div>
<div class="ctrl"><label>Frequency f <span class="val" id="fv"></span></label><input id="f" type="range" min="1" max="500" value="50" step="1"></div></div></section>
<section class="card"><div class="ch">AC Waveforms</div><div class="sim"><canvas id="c"></canvas><div class="badges"><div class="badge">I=<span id="in"></span>A</div><div class="badge">φ=<span id="phin"></span>°</div><div class="badge">f₀=<span id="f0n"></span>Hz</div></div></div><div class="bar"><button id="play">▶ Play</button><button id="pause">⏸ Pause</button><button id="reset">↺ Reset</button><button id="record">＋ Record</button></div></section>
<section class="card right"><div class="ch">Analisis</div><div class="cb"><div class="stats"><div class="stat"><small>Impedance |Z|</small><strong id="Z"></strong></div><div class="stat"><small>Current Irms</small><strong id="I"></strong></div><div class="stat"><small>Power factor</small><strong id="PF"></strong></div><div class="stat"><small>Real power</small><strong id="P"></strong></div></div><div class="formula">X_L=2πfL<br>X_C=1/(2πfC)<br>|Z|=√(R²+(X_L−X_C)²)<br>f₀=1/(2π√LC)</div><div class="chart"><canvas id="g"></canvas></div><div class="table"><table><thead><tr><th>#</th><th>f</th><th>Z</th><th>I</th><th>PF</th></tr></thead><tbody id="tb"></tbody></table></div></div></section></div></div>
<script>
const $=i=>document.getElementById(i),c=$('c'),ctx=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let run=true,t=0,last=performance.now(),rows=[];
function q(){let V=+$('V').value,R=+$('R').value,L=+$('L').value,C=+$('C').value*1e-6,f=+$('f').value,w=2*Math.PI*f,XL=w*L,XC=1/(w*C),Z=Math.sqrt(R*R+(XL-XC)**2),I=V/Z,phi=Math.atan2(XL-XC,R),PF=Math.cos(phi),P=V*I*PF,f0=1/(2*Math.PI*Math.sqrt(L*C));return{V,R,L,C,f,w,XL,XC,Z,I,phi,PF,P,f0}}
function resize(){let D=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*D;c.height=r.height*D;ctx.setTransform(D,0,0,D,0,0);r=g.getBoundingClientRect();g.width=r.width*D;g.height=r.height*D;gx.setTransform(D,0,0,D,0,0);draw();chart()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),cy=H/2;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#29465f';ctx.beginPath();ctx.moveTo(30,cy);ctx.lineTo(W-20,cy);ctx.stroke();for(let mode=0;mode<2;mode++){ctx.strokeStyle=mode?'#ff758f':'#31d6c5';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=220;i++){let X=30+i/220*(W-50),ang=i/220*4*Math.PI+z.w*t*.15,val=Math.sin(ang-(mode?z.phi:0)),Y=cy-val*95;if(i)ctx.lineTo(X,Y);else ctx.moveTo(X,Y)}ctx.stroke()}ctx.fillStyle='#31d6c5';ctx.fillText('Voltage',45,45);ctx.fillStyle='#ff758f';ctx.fillText('Current',115,45);$('in').textContent=z.I.toFixed(3);$('phin').textContent=(z.phi*180/Math.PI).toFixed(1);$('f0n').textContent=z.f0.toFixed(1)}
function update(){let z=q();$('Vv').textContent=z.V+' V';$('Rv').textContent=z.R+' Ω';$('Lv').textContent=z.L.toFixed(2)+' H';$('Cv').textContent=(z.C*1e6).toFixed(0)+' μF';$('fv').textContent=z.f+' Hz';$('Z').textContent=z.Z.toFixed(2)+' Ω';$('I').textContent=z.I.toFixed(3)+' A';$('PF').textContent=z.PF.toFixed(3);$('P').textContent=z.P.toFixed(2)+' W';draw();chart()}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=30,z=q(),vals=[],mx=0;for(let f=1;f<=500;f+=3){let w=2*Math.PI*f,Z=Math.sqrt(z.R*z.R+(w*z.L-1/(w*z.C))**2),I=z.V/Z;vals.push([f,I]);mx=Math.max(mx,I)}gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,10);gx.lineTo(p,H-p);gx.lineTo(W-10,H-p);gx.stroke();gx.strokeStyle='#ffd166';gx.beginPath();vals.forEach((v,i)=>{let X=p+(v[0]-1)/499*(W-p-12),Y=H-p-v[1]/mx*(H-p-18);if(i)gx.lineTo(X,Y);else gx.moveTo(X,Y)});gx.stroke()}
function loop(n){let dt=Math.min((n-last)/1000,.04);last=n;if(run){t+=dt;draw()}requestAnimationFrame(loop)}$('play').onclick=()=>run=true;$('pause').onclick=()=>run=!run;$('reset').onclick=()=>{t=0;run=true;draw()};['V','R','L','C','f'].forEach(i=>$(i).oninput=update);$('record').onclick=()=>{let z=q();rows.push(z);$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.f}</td><td>${r.Z.toFixed(2)}</td><td>${r.I.toFixed(3)}</td><td>${r.PF.toFixed(3)}</td></tr>`).join('')};$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='No,f_Hz,Z_ohm,I_A,PF,P_W\n'+rows.map((r,i)=>[i+1,r.f,r.Z,r.I,r.PF,r.P].join(',')).join('\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rlc_resonance.csv';a.click()};new ResizeObserver(resize).observe(document.body);update();requestAnimationFrame(loop);
</script></body></html>
