<!doctype html><html lang=id><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Ultrasonic Distance</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#071525;color:#eef7ff}.app{max-width:1450px;margin:auto;padding:18px}.sub,.note{color:#9db5cb}.grid{display:grid;grid-template-columns:300px 1fr 355px;gap:14px}.card{background:#0d2237;border:1px solid #29465f;border-radius:17px;overflow:hidden}.hd{padding:13px 15px;font-weight:800;border-bottom:1px solid #29465f}.p{padding:14px}.ctrl{margin-bottom:13px}.ctrl label{display:flex;justify-content:space-between;font-size:13px}.v{color:#31d6c5;font-weight:700}input{width:100%;accent-color:#31d6c5}button{background:#102b45;color:white;border:1px solid #315572;border-radius:9px;padding:9px 11px}.sim{height:500px;background:#081725;position:relative}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:11px;display:flex;gap:7px;flex-wrap:wrap}.badge{position:absolute;top:10px;left:10px;background:#06131ddd;border:1px solid #315572;padding:7px;border-radius:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:9px;padding:9px}.stat small{display:block;color:#9db5cb}.formula{margin-top:10px;padding:10px;background:#081927;border-left:3px solid #31d6c5;border-radius:8px;font:12px Consolas;line-height:1.6}.chart{height:220px;margin-top:10px}.tbl{max-height:145px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}td,th{padding:6px;border-bottom:1px solid #24445f;text-align:right}@media(max-width:1050px){.grid{grid-template-columns:285px 1fr}.right{grid-column:1/-1}}@media(max-width:700px){.grid{grid-template-columns:1fr}.right{grid-column:auto}}</style></head><body><div class=app><h1>63 — Ultrasonic Sensor & Distance Measurement</h1><div class=sub>Time-of-flight • echo pulse • speed of sound • temperature compensation</div><div class=grid><div class=card><div class=hd>Parameters</div><div class=p><div class=ctrl><label>Target distance <span class=v id=dv></span></label><input id=d type=range min=50 max=4000 value=1000 step=10></div><div class=ctrl><label>Air temperature <span class=v id=Tv></span></label><input id=T type=range min=-10 max=50 value=25></div><div class=ctrl><label>Ultrasonic frequency <span class=v id=fv></span></label><input id=f type=range min=20 max=80 value=40></div><div class=ctrl><label>Echo reflectivity <span class=v id=rv></span></label><input id=r type=range min=.1 max=1 value=.8 step=.05></div></div></div><div class=card><div class=hd>Time-of-Flight Visualization</div><div class=sim><canvas id=c></canvas><div class=badge>Echo time: <b id=tn></b></div></div><div class=bar><button id=ping>📡 Send Pulse</button><button id=auto>▶ Auto Ping</button><button id=pause>⏸ Pause</button><button id=record>＋ Record</button><button id=csv>CSV</button></div></div><div class="card right"><div class=hd>Analysis</div><div class=p><div class=stats><div class=stat><small>Speed of sound</small><b id=C></b></div><div class=stat><small>Round-trip time</small><b id=TOF></b></div><div class=stat><small>Wavelength</small><b id=L></b></div><div class=stat><small>Echo strength</small><b id=E></b></div></div><div class=formula>c ≈ 331.3 + 0.606T m/s<br>t_echo = 2d/c<br>λ = c/f</div><div class=chart><canvas id=g></canvas></div><div class=tbl><table><thead><tr><th>#</th><th>d mm</th><th>T °C</th><th>t ms</th></tr></thead><tbody id=tb></tbody></table></div></div></div></div></div><script>
const $=i=>document.getElementById(i),c=$('c'),x=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let run=false,pulse=0,last=performance.now(),rows=[];
function q(dd=null){let d=(dd===null?+$('d').value:dd)/1000,T=+$('T').value,f=+$('f').value*1000,r=+$('r').value,cs=331.3+.606*T,tof=2*d/cs,lam=cs/f,echo=r/(1+d*d*.25);return{d,T,f,r,cs,tof,lam,echo}}
function u(){let z=q();$('dv').textContent=(z.d*1000).toFixed(0)+' mm';$('Tv').textContent=z.T+' °C';$('fv').textContent=(z.f/1000).toFixed(0)+' kHz';$('rv').textContent=z.r.toFixed(2);$('tn').textContent=(z.tof*1000).toFixed(3)+' ms';$('C').textContent=z.cs.toFixed(1)+' m/s';$('TOF').textContent=(z.tof*1000).toFixed(3)+' ms';$('L').textContent=(z.lam*1000).toFixed(2)+' mm';$('E').textContent=(z.echo*100).toFixed(1)+'%';draw();chart()}
function size(){let d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);r=g.getBoundingClientRect();g.width=r.width*d;g.height=r.height*d;gx.setTransform(d,0,0,d,0,0);u()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),sx=85,tx=W-100,cy=H/2;x.clearRect(0,0,W,H);x.fillStyle='#173b58';x.fillRect(35,cy-65,90,130);x.fillStyle='#eef7ff';x.fillText('ULTRASONIC',42,cy+90);x.fillStyle='#ffd166';x.fillRect(tx,cy-110,35,220);let p=pulse%2,frac=p<1?p:2-p,px=sx+frac*(tx-sx);x.strokeStyle=p<1?'#31d6c5':'#ff758f';x.lineWidth=4;for(let i=0;i<4;i++){x.beginPath();x.arc(px,cy,12+i*10,-1,1);x.stroke()}x.fillStyle='#eef7ff';x.fillText(p<1?'TRANSMIT →':'← ECHO',W/2-35,cy-130)}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=28;gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,H-25);gx.lineTo(W-8,H-25);gx.stroke();gx.strokeStyle='#31d6c5';gx.beginPath();for(let i=0;i<=100;i++){let d=50+i/100*3950,z=q(d),X=p+i/100*(W-p-10),Y=H-25-z.tof/.025*(H-45);i?gx.lineTo(X,Y):gx.moveTo(X,Y)}gx.stroke();gx.fillStyle='#eef7ff';gx.fillText('Echo time vs distance',p,13)}
function loop(n){let dt=Math.min((n-last)/1000,.04);last=n;if(run){pulse+=dt*1.4;if(pulse>=2)pulse=0;draw()}requestAnimationFrame(loop)}$('ping').onclick=()=>{pulse=0;run=true;setTimeout(()=>run=false,1450)};$('auto').onclick=()=>run=true;$('pause').onclick=()=>run=false;['d','T','f','r'].forEach(i=>$(i).oninput=u);$('record').onclick=()=>{let z=q();rows.push(z);$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${(r.d*1000).toFixed(0)}</td><td>${r.T}</td><td>${(r.tof*1000).toFixed(3)}</td></tr>`).join('')};$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='distance_m,temp_C,freq_Hz,speed_m_s,tof_s,wavelength_m,echo\n'+rows.map(r=>[r.d,r.T,r.f,r.cs,r.tof,r.lam,r.echo].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='ultrasonic_distance.csv';a.click()};new ResizeObserver(size).observe(document.body);u();requestAnimationFrame(loop)</script></body></html>
