<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Rotary Encoder</title><style>*{box-sizing:border-box}body{margin:0;font:15px Segoe UI;background:#071525;color:#eef7ff}.app{max-width:1400px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:300px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #29465f;border-radius:16px;overflow:hidden}.p{padding:14px}.sim{height:500px;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%}input,select{width:100%}label{display:block;margin:12px 0 4px}.v{color:#31d6c5}.bar{display:flex;gap:8px;padding:12px;flex-wrap:wrap}button,select{background:#102b45;color:white;border:1px solid #315572;border-radius:8px;padding:8px}.chart{height:220px}.stat{padding:9px;background:#081a2a;margin:7px 0;border-radius:8px}.formula{padding:10px;background:#081927;border-left:3px solid #31d6c5;font-family:Consolas}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><div class=app><h1>58 — Rotary Encoder & Angular Position Measurement</h1><p>Incremental encoder • quadrature A/B • pulses per revolution • angular position & speed</p><div class=grid><div class=card><div class=p><label>Angular position <span class=v id=av></span></label><input id=a type=range min=0 max=360 value=45 step=.5><label>Pulses/revolution <span class=v id=pv></span></label><input id=p type=range min=20 max=1000 value=360 step=10><label>Speed <span class=v id=sv></span></label><input id=s type=range min=-300 max=300 value=60 step=5></div></div><div class=card><div class=sim><canvas id=c></canvas></div><div class=bar><button id=play>▶ Rotate</button><button id=pause>⏸ Pause</button><button id=zero>◎ Zero</button><button id=record>＋ Record</button></div></div><div class=card><div class=p><div class=stat>Pulse count: <b id=count></b></div><div class=stat>Resolution: <b id=resolution></b></div><div class=stat>Channel A/B: <b id=ab></b></div><div class=stat>Direction: <b id=dir></b></div><div class=formula>Resolution = 360° / PPR<br>Count ≈ θ × PPR / 360°<br>Quadrature A/B determines direction.</div><div class=chart><canvas id=g></canvas></div><div id=log></div></div></div></div></div><script>
const $=i=>document.getElementById(i),c=$('c'),x=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let run=false,last=performance.now(),rows=[];
function q(){let a=+$('a').value,p=+$('p').value,s=+$('s').value,count=Math.round(a*p/360),phase=a*p/360*2*Math.PI,A=Math.sin(phase)>=0?1:0,B=Math.sin(phase-Math.PI/2)>=0?1:0;return{a,p,s,count,A,B,res:360/p}}
function u(){let z=q();$('av').textContent=z.a.toFixed(1)+'°';$('pv').textContent=z.p+' PPR';$('sv').textContent=z.s+' rpm';$('count').textContent=z.count;$('resolution').textContent=z.res.toFixed(3)+'°/pulse';$('ab').textContent=z.A+' / '+z.B;$('dir').textContent=z.s>0?'CW':z.s<0?'CCW':'STOP';draw();wave()}
function size(){let d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);r=g.getBoundingClientRect();g.width=r.width*d;g.height=r.height*d;gx.setTransform(d,0,0,d,0,0);u()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),cx=W/2,cy=H/2,R=150;x.clearRect(0,0,W,H);x.strokeStyle='#eef7ff';x.lineWidth=3;x.beginPath();x.arc(cx,cy,R,0,7);x.stroke();for(let i=0;i<36;i++){let a=i/36*2*Math.PI;x.strokeStyle=i%2?'#173b58':'#31d6c5';x.beginPath();x.moveTo(cx+Math.cos(a)*(R-22),cy+Math.sin(a)*(R-22));x.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);x.stroke()}let a=z.a*Math.PI/180;x.strokeStyle='#ffd166';x.lineWidth=6;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*R*.8,cy+Math.sin(a)*R*.8);x.stroke();x.fillStyle='#eef7ff';x.fillText(z.a.toFixed(1)+'°',cx-20,cy+190)}
function wave(){let W=g.clientWidth,H=g.clientHeight,p=20,z=q();gx.clearRect(0,0,W,H);['#31d6c5','#ffd166'].forEach((col,j)=>{gx.strokeStyle=col;gx.beginPath();for(let i=0;i<=100;i++){let ph=i/100*8*Math.PI-j*Math.PI/2,Y=(j?H*.68:H*.28)+(Math.sin(ph)>=0?-22:22),X=p+i/100*(W-2*p);i?gx.lineTo(X,Y):gx.moveTo(X,Y)}gx.stroke()});gx.fillStyle='#eef7ff';gx.fillText('A',4,H*.28);gx.fillText('B',4,H*.68)}
function loop(n){let dt=Math.min((n-last)/1000,.05);last=n;if(run){let z=q(),a=(z.a+z.s*6*dt)%360;if(a<0)a+=360;$('a').value=a;u()}requestAnimationFrame(loop)}$('play').onclick=()=>run=true;$('pause').onclick=()=>run=!run;$('zero').onclick=()=>{$('a').value=0;run=false;u()};['a','p','s'].forEach(i=>$(i).oninput=u);$('record').onclick=()=>{rows.push(q());$('log').innerHTML='Records: '+rows.length};new ResizeObserver(size).observe(document.body);u();requestAnimationFrame(loop)</script></body></html>
