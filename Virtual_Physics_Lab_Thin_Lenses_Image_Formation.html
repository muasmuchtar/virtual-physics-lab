<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thin Lenses</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#06101d,#091827);color:#eef7ff}.app{max-width:1500px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{margin:0}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:310px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #24445f;border-radius:18px;overflow:hidden}.ch{padding:14px 16px;border-bottom:1px solid #24445f;font-weight:800}.cb{padding:15px}.ctrl{margin-bottom:14px}.ctrl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:#31d6c5;font-weight:800}input[type=range]{width:100%;accent-color:#31d6c5}select,button{background:#102b45;border:1px solid #315572;color:white;padding:9px 12px;border-radius:10px;cursor:pointer}select{width:100%}.sim{height:540px;position:relative;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}.badge{background:#06131ddd;border:1px solid #315572;padding:7px 9px;border-radius:9px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:11px;padding:10px}.stat small{display:block;color:#9db5cb}.stat strong{font-size:18px}.formula{margin-top:12px;border-left:3px solid #31d6c5;background:#081927;padding:11px;border-radius:9px;font-family:Consolas,monospace;line-height:1.6;font-size:12px}.chart{height:235px;margin-top:12px}.table{max-height:210px;overflow:auto;margin-top:12px;border:1px solid #24445f;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #1a354d;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:1100px){.grid{grid-template-columns:290px 1fr}.right{grid-column:1/-1}}@media(max-width:720px){.grid{grid-template-columns:1fr}.right{grid-column:auto}.head{flex-direction:column;align-items:flex-start}.sim{height:450px}}
</style>
</head><body><div class="app">
<div class="head"><div><h1>21 — Thin Lenses & Image Formation</h1><div class="sub">Converging / Diverging Lens • Ray Diagram • Magnification</div></div><button id="csv">Export CSV</button></div>
<div class="grid">
<section class="card"><div class="ch">Parameter</div><div class="cb">
<div class="ctrl"><label>Tipe lensa</label><select id="type"><option value="conv">Converging</option><option value="div">Diverging</option></select></div>
<div class="ctrl"><label>Focal length |f| <span class="val" id="fv"></span></label><input id="f" type="range" min="5" max="40" value="15" step="1"></div>
<div class="ctrl"><label>Object distance dₒ <span class="val" id="dov"></span></label><input id="do" type="range" min="6" max="80" value="35" step="1"></div>
<div class="ctrl"><label>Object height hₒ <span class="val" id="hov"></span></label><input id="ho" type="range" min="1" max="15" value="8" step=".5"></div>
</div></section>
<section class="card"><div class="ch">Ray Diagram</div><div class="sim"><canvas id="c"></canvas><div class="badges"><div class="badge">dᵢ=<span id="din"></span> cm</div><div class="badge">m=<span id="mn"></span></div><div class="badge"><span id="status"></span></div></div></div>
<div class="bar"><button id="animate">▶ Animate Rays</button><button id="reset">↺ Reset</button><button id="record">＋ Record</button></div></section>
<section class="card right"><div class="ch">Analisis</div><div class="cb"><div class="stats">
<div class="stat"><small>Image distance dᵢ</small><strong id="di"></strong></div><div class="stat"><small>Magnification m</small><strong id="mag"></strong></div><div class="stat"><small>Image height hᵢ</small><strong id="hi"></strong></div><div class="stat"><small>Image type</small><strong id="itype"></strong></div></div>
<div class="formula">1/f = 1/dₒ + 1/dᵢ<br>m = −dᵢ/dₒ = hᵢ/hₒ<br>f &gt; 0 converging; f &lt; 0 diverging</div>
<div class="chart"><canvas id="g"></canvas></div><div class="table"><table><thead><tr><th>#</th><th>f</th><th>do</th><th>di</th><th>m</th><th>type</th></tr></thead><tbody id="tb"></tbody></table></div></div></section>
</div></div><script>
const $=i=>document.getElementById(i),c=$('c'),ctx=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let phase=1,rows=[];
function q(){let type=$('type').value,F=+$('f').value*(type==='conv'?1:-1),d=+$('do').value,ho=+$('ho').value,di=1/(1/F-1/d),m=-di/d,hi=m*ho,kind=di>0?(m<0?'Real, inverted':'Real'):'Virtual, upright';return{type,F,d,ho,di,m,hi,kind}}
function resize(){let D=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*D;c.height=r.height*D;ctx.setTransform(D,0,0,D,0,0);r=g.getBoundingClientRect();g.width=r.width*D;g.height=r.height*D;gx.setTransform(D,0,0,D,0,0);draw();chart()}
function line(x1,y1,x2,y2,col,dash=[]){ctx.strokeStyle=col;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
function arrow(x,y,h,col){ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-h);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x-7,y-h+12);ctx.lineTo(x+7,y-h+12);ctx.closePath();ctx.fill()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),cx=W/2,cy=H/2,scale=Math.min(7,(W*.42)/80),ox=cx-z.d*scale,oy=cy,ix=cx+z.di*scale,ih=z.hi*scale,oh=z.ho*scale,fpx=Math.abs(z.F)*scale;ctx.clearRect(0,0,W,H);line(35,cy,W-35,cy,'#8aa2b7');line(cx,60,cx,H-60,'#58a8ff');line(cx-fpx,cy-8,cx-fpx,cy+8,'#ffd166');line(cx+fpx,cy-8,cx+fpx,cy+8,'#ffd166');arrow(ox,oy,oh,'#ffd166');if(Math.abs(ix)<W*2)arrow(ix,cy,-ih,'#ff758f');
let topY=cy-oh;if(z.type==='conv'){line(ox,topY,cx,topY,'#31d6c5');line(cx,topY,ix,cy-ih,'#31d6c5');line(ox,topY,cx,cy,'#a8d8ff');line(cx,cy,ix,cy-ih,'#a8d8ff')}else{line(ox,topY,cx,topY,'#31d6c5');let slope=(topY-cy)/(cx-(cx-fpx));line(cx,topY,W,topY+(W-cx)*slope,'#31d6c5');line(cx,topY,cx-fpx,cy,'#31d6c5',[5,5]);line(ox,topY,cx,cy,'#a8d8ff');line(cx,cy,W,cy+(W-cx)*(cy-topY)/(cx-ox),'#a8d8ff')}
$('din').textContent=z.di.toFixed(1);$('mn').textContent=z.m.toFixed(2);$('status').textContent=z.kind}
function update(){let z=q();$('fv').textContent=Math.abs(z.F).toFixed(0)+' cm';$('dov').textContent=z.d+' cm';$('hov').textContent=z.ho.toFixed(1)+' cm';$('di').textContent=z.di.toFixed(2)+' cm';$('mag').textContent=z.m.toFixed(2);$('hi').textContent=z.hi.toFixed(2)+' cm';$('itype').textContent=z.kind;draw();chart()}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=30,z=q();gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,10);gx.lineTo(p,H-p);gx.lineTo(W-10,H-p);gx.stroke();gx.strokeStyle='#31d6c5';gx.beginPath();let started=false;for(let i=0;i<=100;i++){let d=6+i*.74,di=1/(1/z.F-1/d);if(Math.abs(di)<150){let X=p+i/100*(W-p-12),Y=H/2-di/150*(H*.36);if(started)gx.lineTo(X,Y);else{gx.moveTo(X,Y);started=true}}}gx.stroke()}
$('type').oninput=update;['f','do','ho'].forEach(i=>$(i).oninput=update);$('animate').onclick=()=>{phase=0;let st=performance.now();function a(n){phase=Math.min(1,(n-st)/700);draw();if(phase<1)requestAnimationFrame(a)}requestAnimationFrame(a)};$('reset').onclick=()=>{$('type').value='conv';$('f').value=15;$('do').value=35;$('ho').value=8;update()};
$('record').onclick=()=>{let z=q();rows.push(z);$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.F.toFixed(1)}</td><td>${r.d.toFixed(1)}</td><td>${r.di.toFixed(1)}</td><td>${r.m.toFixed(2)}</td><td>${r.kind}</td></tr>`).join('')};
$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='No,f_cm,do_cm,di_cm,magnification,type\n'+rows.map((r,i)=>[i+1,r.F,r.d,r.di,r.m,r.kind].join(',')).join('\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='thin_lens.csv';a.click()};
new ResizeObserver(resize).observe(document.body);update();
</script></body></html>
