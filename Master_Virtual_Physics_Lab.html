let active=categories[0].id;const $=i=>document.getElementById(i);
function cname(id){return categories.find(c=>c.id===id)?.name||''}
function side(){$('sidebar').innerHTML=categories.map(c=>`<button class="cat ${c.id===active?'active':''}" data-id="${c.id}"><div class="cat-top"><span>${c.name}</span><span class="count">${c.count}</span></div><small>Modul ${c.range} • ${c.desc}</small></button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{active=b.dataset.id;$('search').value='';render()});$('mobileCats').innerHTML=categories.map(c=>`<option value="${c.id}" ${c.id===active?'selected':''}>${c.name} (${c.count})</option>`).join('')}
function cards(){let q=$('search').value.trim().toLowerCase(),cat=categories.find(c=>c.id===active),items;if(q){items=modules.filter(m=>(m.title+' '+m.num+' '+cname(m.category)).toLowerCase().includes(q));$('catTitle').textContent='Hasil Pencarian';$('catDesc').textContent='Pencarian pada seluruh 160 modul.'}else{items=modules.filter(m=>m.category===active);$('catTitle').textContent=cat.name;$('catDesc').textContent=`Modul ${cat.range} • ${cat.desc}`}$('shown').textContent=`${items.length} modul ditampilkan`;$('grid').innerHTML=items.length?items.map(m=>`<article class="card"><div class="top"><div class="num">${String(m.num).padStart(2,'0')}</div><div class="tag">${cname(m.category)}</div></div><h3>${m.title}</h3><a href="${m.href}">Buka Simulasi</a></article>`).join(''):`<div class="empty">Tidak ada modul yang cocok.</div>`}
function render(){side();cards()}$('search').oninput=cards;$('clear').onclick=()=>{$('search').value='';cards()};$('mobileCats').onchange=e=>{active=e.target.value;$('search').value='';render()};render();
</script></body></html>
