<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electromagnetic Waves</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#06101d,#091827);color:#eef7ff}.app{max-width:1500px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{margin:0}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:310px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #24445f;border-radius:18px;overflow:hidden}.ch{padding:14px 16px;border-bottom:1px solid #24445f;font-weight:800}.cb{padding:15px}.ctrl{margin-bottom:14px}.ctrl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:#31d6c5;font-weight:800}input[type=range]{width:100%;accent-color:#31d6c5}button{background:#102b45;border:1px solid #315572;color:white;padding:9px 12px;border-radius:10px;cursor:pointer}.sim{height:540px;position:relative;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}.badge{background:#06131ddd;border:1px solid #315572;padding:7px 9px;border-radius:9px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:11px;padding:10px}.stat small{display:block;color:#9db5cb}.stat strong{font-size:18px}.formula{margin-top:12px;border-left:3px solid #31d6c5;background:#081927;padding:11px;border-radius:9px;font-family:Consolas,monospace;line-height:1.6;font-size:12px}.chart{height:235px;margin-top:12px}.table{max-height:210px;overflow:auto;margin-top:12px;border:1px solid #24445f;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #1a354d;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:1100px){.grid{grid-template-columns:290px 1fr}.right{grid-column:1/-1}}@media(max-width:720px){.grid{grid-template-columns:1fr}.right{grid-column:auto}.head{flex-direction:column;align-items:flex-start}.sim{height:450px}}</style></head><body><div class="app">
<div class="head"><div><h1>28 — Electromagnetic Waves & Spectrum</h1><div class="sub">E–B Fields • Wavelength • Frequency • Photon Energy</div></div><button id="csv">Export CSV</button></div><div class="grid">
<section class="card"><div class="ch">Parameter</div><div class="cb">
<div class="ctrl"><label>log₁₀(f / Hz) <span class="val" id="fv"></span></label><input id="lf" type="range" min="3" max="20" value="14.7" step=".1"></div>
<div class="ctrl"><label>E-field amplitude <span class="val" id="Ev"></span></label><input id="E0" type="range" min="1" max="100" value="40" step="1"></div>
<div class="ctrl"><label>Animation speed <span class="val" id="sv"></span></label><input id="sp" type="range" min=".2" max="3" value="1" step=".1"></div></div></section>
<section class="card"><div class="ch">EM Wave Simulation</div><div class="sim"><canvas id="c"></canvas><div class="badges"><div class="badge">λ=<span id="ln"></span></div><div class="badge">f=<span id="fn"></span></div><div class="badge"><span id="band"></span></div></div></div><div class="bar"><button id="play">▶ Play</button><button id="pause">⏸ Pause</button><button id="reset">↺ Reset</button><button id="record">＋ Record</button></div></section>
<section class="card right"><div class="ch">Analisis</div><div class="cb"><div class="stats"><div class="stat"><small>Wavelength</small><strong id="L"></strong></div><div class="stat"><small>Frequency</small><strong id="F"></strong></div><div class="stat"><small>Photon energy</small><strong id="PE"></strong></div><div class="stat"><small>B amplitude</small><strong id="B"></strong></div></div><div class="formula">c = fλ<br>E = hf<br>E₀/B₀ = c<br>c = 2.998×10⁸ m/s</div><div class="chart"><canvas id="g"></canvas></div><div class="table"><table><thead><tr><th>#</th><th>Band</th><th>f</th><th>λ</th><th>E eV</th></tr></thead><tbody id="tb"></tbody></table></div></div></section></div></div>
<script>
const $=i=>document.getElementById(i),c=$('c'),ctx=c.getContext('2d'),g=$('g'),gx=g.getContext('2d'),C=299792458,H=6.62607015e-34,EV=1.602176634e-19;let run=true,t=0,last=performance.now(),rows=[];
function band(f){if(f<3e9)return'Radio';if(f<3e11)return'Microwave';if(f<4e14)return'Infrared';if(f<7.5e14)return'Visible';if(f<3e16)return'Ultraviolet';if(f<3e19)return'X-ray';return'Gamma'}
function q(){let lf=+$('lf').value,f=10**lf,E0=+$('E0').value,sp=+$('sp').value,lam=C/f,pe=H*f/EV,B0=E0/C;return{lf,f,E0,sp,lam,pe,B0,b:band(f)}}
function fmt(x,u){if(x>=1)return x.toPrecision(3)+' '+u;if(x>=1e-3)return(x*1e3).toPrecision(3)+' mm';if(x>=1e-6)return(x*1e6).toPrecision(3)+' μm';if(x>=1e-9)return(x*1e9).toPrecision(3)+' nm';return x.toExponential(2)+' '+u}
function resize(){let D=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*D;c.height=r.height*D;ctx.setTransform(D,0,0,D,0,0);r=g.getBoundingClientRect();g.width=r.width*D;g.height=r.height*D;gx.setTransform(D,0,0,D,0,0);draw();chart()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),cy=H/2;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#29465f';ctx.beginPath();ctx.moveTo(30,cy);ctx.lineTo(W-20,cy);ctx.stroke();for(let m=0;m<2;m++){ctx.strokeStyle=m?'#58a8ff':'#ff758f';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=240;i++){let X=30+i/240*(W-50),a=i/240*6*Math.PI-t*4*z.sp,Y=cy+(m?1:-1)*Math.sin(a)*(m?55:100);if(i)ctx.lineTo(X,Y);else ctx.moveTo(X,Y)}ctx.stroke()}ctx.fillStyle='#ff758f';ctx.fillText('Electric field E',45,45);ctx.fillStyle='#58a8ff';ctx.fillText('Magnetic field B (scaled)',155,45);$('ln').textContent=fmt(z.lam,'m');$('fn').textContent=z.f.toExponential(2)+' Hz';$('band').textContent=z.b}
function update(){let z=q();$('fv').textContent=z.lf.toFixed(1);$('Ev').textContent=z.E0+' V/m';$('sv').textContent=z.sp.toFixed(1)+'×';$('L').textContent=fmt(z.lam,'m');$('F').textContent=z.f.toExponential(3)+' Hz';$('PE').textContent=z.pe.toExponential(3)+' eV';$('B').textContent=z.B0.toExponential(3)+' T';draw();chart()}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=25,bands=[['Radio',3,9.48],['Micro',9.48,11.48],['IR',11.48,14.60],['Visible',14.60,14.88],['UV',14.88,16.48],['X-ray',16.48,19.48],['Gamma',19.48,20]],span=17;gx.clearRect(0,0,W,H);bands.forEach((b,i)=>{let x1=p+(b[1]-3)/span*(W-2*p),x2=p+(b[2]-3)/span*(W-2*p);gx.globalAlpha=.25+.08*(i%2);gx.fillStyle='#31d6c5';gx.fillRect(x1,45,x2-x1,H-85);gx.globalAlpha=1;gx.fillStyle='#eef7ff';gx.font='10px Segoe UI';gx.fillText(b[0],x1+3,H-25)});let z=q(),X=p+(z.lf-3)/span*(W-2*p);gx.strokeStyle='#ffd166';gx.lineWidth=3;gx.beginPath();gx.moveTo(X,25);gx.lineTo(X,H-35);gx.stroke()}
function loop(n){let dt=Math.min((n-last)/1000,.04);last=n;if(run){t+=dt;draw()}requestAnimationFrame(loop)}$('play').onclick=()=>run=true;$('pause').onclick=()=>run=!run;$('reset').onclick=()=>{t=0;run=true;draw()};['lf','E0','sp'].forEach(i=>$(i).oninput=update);$('record').onclick=()=>{let z=q();rows.push(z);$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.b}</td><td>${r.f.toExponential(2)}</td><td>${r.lam.toExponential(2)}</td><td>${r.pe.toExponential(2)}</td></tr>`).join('')};$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='No,band,frequency_Hz,wavelength_m,photon_energy_eV\n'+rows.map((r,i)=>[i+1,r.b,r.f,r.lam,r.pe].join(',')).join('\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='em_spectrum.csv';a.click()};new ResizeObserver(resize).observe(document.body);update();requestAnimationFrame(loop);
</script></body></html>
