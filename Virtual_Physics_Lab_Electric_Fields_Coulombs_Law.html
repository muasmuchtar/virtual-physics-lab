<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electric Fields</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#06101d,#091827);color:#eef7ff}.app{max-width:1500px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{margin:0}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:310px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #24445f;border-radius:18px;overflow:hidden}.ch{padding:14px 16px;border-bottom:1px solid #24445f;font-weight:800}.cb{padding:15px}.ctrl{margin-bottom:14px}.ctrl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:#31d6c5;font-weight:800}input[type=range]{width:100%;accent-color:#31d6c5}select,button{background:#102b45;border:1px solid #315572;color:white;padding:9px 12px;border-radius:10px;cursor:pointer}select{width:100%}.sim{height:540px;position:relative;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}.badge{background:#06131ddd;border:1px solid #315572;padding:7px 9px;border-radius:9px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:11px;padding:10px}.stat small{display:block;color:#9db5cb}.stat strong{font-size:18px}.formula{margin-top:12px;border-left:3px solid #31d6c5;background:#081927;padding:11px;border-radius:9px;font-family:Consolas,monospace;line-height:1.6;font-size:12px}.chart{height:235px;margin-top:12px}.table{max-height:210px;overflow:auto;margin-top:12px;border:1px solid #24445f;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #1a354d;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:1100px){.grid{grid-template-columns:290px 1fr}.right{grid-column:1/-1}}@media(max-width:720px){.grid{grid-template-columns:1fr}.right{grid-column:auto}.head{flex-direction:column;align-items:flex-start}.sim{height:450px}}
</style>
</head><body><div class="app">
<div class="head"><div><h1>22 — Electric Fields & Coulomb’s Law</h1><div class="sub">Point Charges • Force • Electric Field • Potential</div></div><button id="csv">Export CSV</button></div>
<div class="grid">
<section class="card"><div class="ch">Parameter</div><div class="cb">
<div class="ctrl"><label>Charge q₁ <span class="val" id="q1v"></span></label><input id="q1" type="range" min="-10" max="10" value="5" step=".5"></div>
<div class="ctrl"><label>Charge q₂ <span class="val" id="q2v"></span></label><input id="q2" type="range" min="-10" max="10" value="-3" step=".5"></div>
<div class="ctrl"><label>Separation r <span class="val" id="rv"></span></label><input id="r" type="range" min=".1" max="2" value=".8" step=".05"></div>
<div class="ctrl"><label>Test position x <span class="val" id="xv"></span></label><input id="xp" type="range" min="-2" max="2" value="0" step=".05"></div>
</div></section>
<section class="card"><div class="ch">Electric Field Simulation</div><div class="sim"><canvas id="c"></canvas><div class="badges"><div class="badge">F=<span id="fn"></span> N</div><div class="badge">E=<span id="en"></span> N/C</div><div class="badge">V=<span id="vn"></span> V</div></div></div>
<div class="bar"><button id="toggle">Field Lines ON/OFF</button><button id="record">＋ Record</button><button id="reset">↺ Reset</button></div></section>
<section class="card right"><div class="ch">Analisis</div><div class="cb"><div class="stats">
<div class="stat"><small>Coulomb force</small><strong id="F"></strong></div><div class="stat"><small>Interaction</small><strong id="int"></strong></div><div class="stat"><small>Field at x</small><strong id="E"></strong></div><div class="stat"><small>Potential at x</small><strong id="V"></strong></div></div>
<div class="formula">F = k|q₁q₂|/r²<br>E = kq/r² (vector)<br>V = kq/r (scalar)<br>k = 8.99×10⁹ N·m²/C²</div>
<div class="chart"><canvas id="g"></canvas></div><div class="table"><table><thead><tr><th>#</th><th>q1 μC</th><th>q2 μC</th><th>r</th><th>F</th></tr></thead><tbody id="tb"></tbody></table></div></div></section>
</div></div><script>
const $=i=>document.getElementById(i),c=$('c'),ctx=c.getContext('2d'),g=$('g'),gx=g.getContext('2d'),K=8.9875517923e9;let lines=true,rows=[];
function q(){let q1=+$('q1').value*1e-6,q2=+$('q2').value*1e-6,r=+$('r').value,x=+$('xp').value,x1=-r/2,x2=r/2,F=K*Math.abs(q1*q2)/(r*r),d1=x-x1,d2=x-x2,E=K*q1*Math.sign(d1)/(d1*d1+1e-6)+K*q2*Math.sign(d2)/(d2*d2+1e-6),V=K*q1/(Math.abs(d1)+1e-6)+K*q2/(Math.abs(d2)+1e-6);return{q1,q2,r,x,x1,x2,F,E,V}}
function resize(){let D=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*D;c.height=r.height*D;ctx.setTransform(D,0,0,D,0,0);r=g.getBoundingClientRect();g.width=r.width*D;g.height=r.height*D;gx.setTransform(D,0,0,D,0,0);draw();chart()}
function charge(px,py,qv){ctx.fillStyle=qv>=0?'#ff758f':'#58a8ff';ctx.beginPath();ctx.arc(px,py,24,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 18px Segoe UI';ctx.textAlign='center';ctx.fillText(qv>=0?'+':'−',px,py+6)}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),cx=W/2,cy=H/2,scale=Math.min(W*.32,220)/Math.max(.2,z.r),p1=cx-z.r/2*scale,p2=cx+z.r/2*scale,px=cx+z.x*scale*.45;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#29465f';ctx.beginPath();ctx.moveTo(40,cy);ctx.lineTo(W-40,cy);ctx.stroke();if(lines){for(let j=-4;j<=4;j++){ctx.strokeStyle='#31d6c555';ctx.beginPath();ctx.moveTo(p1,cy);let mid=(p1+p2)/2;ctx.quadraticCurveTo(mid,cy+j*34,p2,cy);ctx.stroke()}}charge(p1,cy,z.q1);charge(p2,cy,z.q2);ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(px,cy,8,0,7);ctx.fill();$('fn').textContent=z.F.toExponential(2);$('en').textContent=z.E.toExponential(2);$('vn').textContent=z.V.toExponential(2)}
function update(){let z=q();$('q1v').textContent=(z.q1*1e6).toFixed(1)+' μC';$('q2v').textContent=(z.q2*1e6).toFixed(1)+' μC';$('rv').textContent=z.r.toFixed(2)+' m';$('xv').textContent=z.x.toFixed(2)+' m';$('F').textContent=z.F.toExponential(3)+' N';$('int').textContent=z.q1*z.q2<0?'Attractive':'Repulsive';$('E').textContent=z.E.toExponential(3)+' N/C';$('V').textContent=z.V.toExponential(3)+' V';draw();chart()}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=30,z=q();gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,10);gx.lineTo(p,H-p);gx.lineTo(W-10,H-p);gx.stroke();gx.strokeStyle='#31d6c5';gx.beginPath();let max=0,vals=[];for(let i=0;i<=100;i++){let r=.1+i*.019,F=K*Math.abs(z.q1*z.q2)/(r*r);vals.push(F);max=Math.max(max,F)}vals.forEach((F,i)=>{let X=p+i/100*(W-p-12),Y=H-p-F/max*(H-p-18);if(i)gx.lineTo(X,Y);else gx.moveTo(X,Y)});gx.stroke()}
['q1','q2','r','xp'].forEach(i=>$(i).oninput=update);$('toggle').onclick=()=>{lines=!lines;draw()};$('reset').onclick=()=>{$('q1').value=5;$('q2').value=-3;$('r').value=.8;$('xp').value=0;lines=true;update()};
$('record').onclick=()=>{let z=q();rows.push(z);$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${(r.q1*1e6).toFixed(1)}</td><td>${(r.q2*1e6).toFixed(1)}</td><td>${r.r.toFixed(2)}</td><td>${r.F.toExponential(2)}</td></tr>`).join('')};
$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='No,q1_uC,q2_uC,r_m,F_N\n'+rows.map((r,i)=>[i+1,r.q1*1e6,r.q2*1e6,r.r,r.F].join(',')).join('\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='electric_fields.csv';a.click()};
new ResizeObserver(resize).observe(document.body);update();
</script></body></html>
