<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Special Relativity</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#06101d,#091827);color:#eef7ff}.app{max-width:1500px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{margin:0}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:310px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #24445f;border-radius:18px;overflow:hidden}.ch{padding:14px 16px;border-bottom:1px solid #24445f;font-weight:800}.cb{padding:15px}.ctrl{margin-bottom:14px}.ctrl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:#31d6c5;font-weight:800}input[type=range]{width:100%;accent-color:#31d6c5}button{background:#102b45;border:1px solid #315572;color:white;padding:9px 12px;border-radius:10px;cursor:pointer}.sim{height:540px;position:relative;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}.badge{background:#06131ddd;border:1px solid #315572;padding:7px 9px;border-radius:9px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:11px;padding:10px}.stat small{display:block;color:#9db5cb}.stat strong{font-size:18px}.formula{margin-top:12px;border-left:3px solid #31d6c5;background:#081927;padding:11px;border-radius:9px;font-family:Consolas,monospace;line-height:1.6;font-size:12px}.chart{height:235px;margin-top:12px}.table{max-height:210px;overflow:auto;margin-top:12px;border:1px solid #24445f;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #1a354d;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:1100px){.grid{grid-template-columns:290px 1fr}.right{grid-column:1/-1}}@media(max-width:720px){.grid{grid-template-columns:1fr}.right{grid-column:auto}.head{flex-direction:column;align-items:flex-start}.sim{height:450px}}</style></head><body><div class="app"><div class="head"><div><h1>32 — Special Relativity</h1><div class="sub">Time Dilation • Length Contraction • Relativistic Energy</div></div><button id="csv">Export CSV</button></div><div class="grid">
<section class="card"><div class="ch">Parameter</div><div class="cb"><div class="ctrl"><label>Velocity β=v/c <span class="val" id="bv"></span></label><input id="b" type="range" min="0" max=".99" value=".8" step=".01"></div><div class="ctrl"><label>Proper time Δτ <span class="val" id="tv"></span></label><input id="tau" type="range" min="1" max="20" value="5" step=".5"></div><div class="ctrl"><label>Proper length L₀ <span class="val" id="lv"></span></label><input id="L0" type="range" min="1" max="100" value="20" step="1"></div><div class="ctrl"><label>Rest mass m₀ <span class="val" id="mv"></span></label><input id="m" type="range" min=".1" max="10" value="1" step=".1"></div></div></section>
<section class="card"><div class="ch">Relativity Visualization</div><div class="sim"><canvas id="c"></canvas><div class="badges"><div class="badge">γ=<span id="gn"></span></div><div class="badge">Δt=<span id="dtn"></span></div><div class="badge">L=<span id="Ln"></span></div></div></div><div class="bar"><button id="play">▶ Animate</button><button id="pause">⏸ Pause</button><button id="reset">↺ Reset</button><button id="record">＋ Record</button></div></section>
<section class="card right"><div class="ch">Analisis</div><div class="cb"><div class="stats"><div class="stat"><small>Lorentz factor γ</small><strong id="G"></strong></div><div class="stat"><small>Dilated time Δt</small><strong id="DT"></strong></div><div class="stat"><small>Contracted length L</small><strong id="LC"></strong></div><div class="stat"><small>Total energy / m₀c²</small><strong id="ER"></strong></div></div><div class="formula">γ=1/√(1−v²/c²)<br>Δt=γΔτ<br>L=L₀/γ<br>E=γm₀c²</div><div class="chart"><canvas id="g"></canvas></div><div class="table"><table><thead><tr><th>#</th><th>β</th><th>γ</th><th>Δt</th><th>L</th></tr></thead><tbody id="tb"></tbody></table></div></div></section></div></div>
<script>
const $=i=>document.getElementById(i),c=$('c'),ctx=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let run=true,t=0,last=performance.now(),rows=[];
function q(){let b=+$('b').value,tau=+$('tau').value,L0=+$('L0').value,m=+$('m').value,G=1/Math.sqrt(1-b*b),DT=G*tau,L=L0/G;return{b,tau,L0,m,G,DT,L}}
function resize(){let D=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*D;c.height=r.height*D;ctx.setTransform(D,0,0,D,0,0);r=g.getBoundingClientRect();g.width=r.width*D;g.height=r.height*D;gx.setTransform(D,0,0,D,0,0);draw();chart()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),cy=H*.52,maxW=W*.55,w=maxW/z.G,x=(t*z.b*120)%(W+maxW)-maxW;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#315572';ctx.beginPath();ctx.moveTo(30,cy+55);ctx.lineTo(W-30,cy+55);ctx.stroke();ctx.fillStyle='#31d6c5';ctx.fillRect(x,cy-35,w,70);ctx.fillStyle='#eef7ff';ctx.font='14px Segoe UI';ctx.fillText('Moving spacecraft',x+10,cy+5);ctx.strokeStyle='#ffd166';ctx.beginPath();ctx.arc(W*.78,H*.24,42,0,7);ctx.stroke();let ang=(t/z.G)*2;ctx.beginPath();ctx.moveTo(W*.78,H*.24);ctx.lineTo(W*.78+34*Math.cos(ang),H*.24+34*Math.sin(ang));ctx.stroke();$('gn').textContent=z.G.toFixed(3);$('dtn').textContent=z.DT.toFixed(2);$('Ln').textContent=z.L.toFixed(2)}
function update(){let z=q();$('bv').textContent=z.b.toFixed(2)+' c';$('tv').textContent=z.tau.toFixed(1)+' s';$('lv').textContent=z.L0+' m';$('mv').textContent=z.m.toFixed(1)+' kg';$('G').textContent=z.G.toFixed(4);$('DT').textContent=z.DT.toFixed(3)+' s';$('LC').textContent=z.L.toFixed(3)+' m';$('ER').textContent=z.G.toFixed(4);draw();chart()}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=30;gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,10);gx.lineTo(p,H-p);gx.lineTo(W-10,H-p);gx.stroke();gx.strokeStyle='#ff758f';gx.beginPath();for(let i=0;i<=100;i++){let b=.99*i/100,G=1/Math.sqrt(1-b*b),X=p+i/100*(W-p-12),Y=H-p-Math.min(1,G/8)*(H-p-18);if(i)gx.lineTo(X,Y);else gx.moveTo(X,Y)}gx.stroke()}
function loop(n){let dt=Math.min((n-last)/1000,.04);last=n;if(run){t+=dt;draw()}requestAnimationFrame(loop)}$('play').onclick=()=>run=true;$('pause').onclick=()=>run=!run;$('reset').onclick=()=>{t=0;run=true;draw()};['b','tau','L0','m'].forEach(i=>$(i).oninput=update);$('record').onclick=()=>{let z=q();rows.push(z);$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.b.toFixed(2)}</td><td>${r.G.toFixed(3)}</td><td>${r.DT.toFixed(2)}</td><td>${r.L.toFixed(2)}</td></tr>`).join('')};$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='No,beta,gamma,proper_time_s,dilated_time_s,proper_length_m,contracted_length_m\n'+rows.map((r,i)=>[i+1,r.b,r.G,r.tau,r.DT,r.L0,r.L].join(',')).join('\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='special_relativity.csv';a.click()};new ResizeObserver(resize).observe(document.body);update();requestAnimationFrame(loop);
</script></body></html>
