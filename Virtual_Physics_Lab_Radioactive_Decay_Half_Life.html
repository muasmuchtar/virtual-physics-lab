<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radioactive Decay</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#06101d,#091827);color:#eef7ff}.app{max-width:1500px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{margin:0}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:310px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #24445f;border-radius:18px;overflow:hidden}.ch{padding:14px 16px;border-bottom:1px solid #24445f;font-weight:800}.cb{padding:15px}.ctrl{margin-bottom:14px}.ctrl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:#31d6c5;font-weight:800}input[type=range]{width:100%;accent-color:#31d6c5}button{background:#102b45;border:1px solid #315572;color:white;padding:9px 12px;border-radius:10px;cursor:pointer}.sim{height:540px;position:relative;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}.badge{background:#06131ddd;border:1px solid #315572;padding:7px 9px;border-radius:9px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:11px;padding:10px}.stat small{display:block;color:#9db5cb}.stat strong{font-size:18px}.formula{margin-top:12px;border-left:3px solid #31d6c5;background:#081927;padding:11px;border-radius:9px;font-family:Consolas,monospace;line-height:1.6;font-size:12px}.chart{height:235px;margin-top:12px}.table{max-height:210px;overflow:auto;margin-top:12px;border:1px solid #24445f;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #1a354d;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:1100px){.grid{grid-template-columns:290px 1fr}.right{grid-column:1/-1}}@media(max-width:720px){.grid{grid-template-columns:1fr}.right{grid-column:auto}.head{flex-direction:column;align-items:flex-start}.sim{height:450px}}</style></head><body><div class="app"><div class="head"><div><h1>31 — Radioactive Decay & Half-Life</h1><div class="sub">Exponential Decay • Activity • Half-Life • Stochastic Nuclei</div></div><button id="csv">Export CSV</button></div><div class="grid">
<section class="card"><div class="ch">Parameter</div><div class="cb"><div class="ctrl"><label>Initial nuclei N₀ <span class="val" id="n0v"></span></label><input id="n0" type="range" min="50" max="500" value="200" step="10"></div><div class="ctrl"><label>Half-life T½ <span class="val" id="hlv"></span></label><input id="hl" type="range" min="1" max="30" value="8" step=".5"></div><div class="ctrl"><label>Time scale <span class="val" id="sv"></span></label><input id="sp" type="range" min=".2" max="5" value="1" step=".1"></div></div></section>
<section class="card"><div class="ch">Decay Simulation</div><div class="sim"><canvas id="c"></canvas><div class="badges"><div class="badge">t=<span id="tn"></span>s</div><div class="badge">N=<span id="nn"></span></div><div class="badge">A=<span id="an"></span>s⁻¹</div></div></div><div class="bar"><button id="play">▶ Play</button><button id="pause">⏸ Pause</button><button id="step">⏭ +1 s</button><button id="reset">↺ Reset</button><button id="record">＋ Record</button></div></section>
<section class="card right"><div class="ch">Analisis</div><div class="cb"><div class="stats"><div class="stat"><small>Decay constant λ</small><strong id="lam"></strong></div><div class="stat"><small>Expected N(t)</small><strong id="N"></strong></div><div class="stat"><small>Activity</small><strong id="A"></strong></div><div class="stat"><small>Decayed fraction</small><strong id="frac"></strong></div></div><div class="formula">N(t)=N₀e^(−λt)<br>λ=ln2/T½<br>A=λN<br>N(T½)=N₀/2</div><div class="chart"><canvas id="g"></canvas></div><div class="table"><table><thead><tr><th>#</th><th>t</th><th>N</th><th>A</th><th>T½</th></tr></thead><tbody id="tb"></tbody></table></div></div></section></div></div>
<script>
const $=i=>document.getElementById(i),c=$('c'),ctx=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let run=true,t=0,last=performance.now(),rows=[];
function q(){let N0=+$('n0').value,hl=+$('hl').value,sp=+$('sp').value,lam=Math.log(2)/hl,N=N0*Math.exp(-lam*t),A=lam*N;return{N0,hl,sp,lam,N,A}}
function resize(){let D=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*D;c.height=r.height*D;ctx.setTransform(D,0,0,D,0,0);r=g.getBoundingClientRect();g.width=r.width*D;g.height=r.height*D;gx.setTransform(D,0,0,D,0,0);draw();chart()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),cols=20,rowsN=Math.ceil(z.N0/cols),dx=(W-80)/cols,dy=Math.min(22,(H-100)/Math.max(1,rowsN));ctx.clearRect(0,0,W,H);for(let i=0;i<z.N0;i++){let alive=i<Math.round(z.N),xx=45+(i%cols)*dx,yy=70+Math.floor(i/cols)*dy;ctx.fillStyle=alive?'#31d6c5':'#33495c';ctx.beginPath();ctx.arc(xx,yy,Math.min(6,dx*.25),0,7);ctx.fill()}$('tn').textContent=t.toFixed(1);$('nn').textContent=Math.round(z.N);$('an').textContent=z.A.toFixed(2)}
function update(){let z=q();$('n0v').textContent=z.N0;$('hlv').textContent=z.hl.toFixed(1)+' s';$('sv').textContent=z.sp.toFixed(1)+'×';$('lam').textContent=z.lam.toFixed(4)+' s⁻¹';$('N').textContent=z.N.toFixed(1);$('A').textContent=z.A.toFixed(2)+' s⁻¹';$('frac').textContent=((1-z.N/z.N0)*100).toFixed(1)+'%';draw();chart()}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=30,z=q();gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,10);gx.lineTo(p,H-p);gx.lineTo(W-10,H-p);gx.stroke();gx.strokeStyle='#31d6c5';gx.beginPath();for(let i=0;i<=120;i++){let tt=i/120*z.hl*5,N=z.N0*Math.exp(-z.lam*tt),X=p+i/120*(W-p-12),Y=H-p-N/z.N0*(H-p-18);if(i)gx.lineTo(X,Y);else gx.moveTo(X,Y)}gx.stroke()}
function loop(n){let dt=Math.min((n-last)/1000,.04);last=n;if(run){t+=dt*q().sp;update()}requestAnimationFrame(loop)}$('play').onclick=()=>run=true;$('pause').onclick=()=>run=!run;$('step').onclick=()=>{run=false;t+=1;update()};$('reset').onclick=()=>{t=0;run=true;update()};['n0','hl','sp'].forEach(i=>$(i).oninput=()=>{t=0;update()});$('record').onclick=()=>{let z=q();rows.push({...z,t});$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.t.toFixed(1)}</td><td>${r.N.toFixed(1)}</td><td>${r.A.toFixed(2)}</td><td>${r.hl}</td></tr>`).join('')};$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='No,time_s,N,activity_s-1,half_life_s\n'+rows.map((r,i)=>[i+1,r.t,r.N,r.A,r.hl].join(',')).join('\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='radioactive_decay.csv';a.click()};new ResizeObserver(resize).observe(document.body);update();requestAnimationFrame(loop);
</script></body></html>
