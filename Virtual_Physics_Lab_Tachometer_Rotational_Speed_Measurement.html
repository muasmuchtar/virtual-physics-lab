<!doctype html><html lang=id><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Tachometer</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#071525;color:#eef7ff}.app{max-width:1450px;margin:auto;padding:18px}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:300px 1fr 355px;gap:14px}.card{background:#0d2237;border:1px solid #29465f;border-radius:17px;overflow:hidden}.hd{padding:13px 15px;font-weight:800;border-bottom:1px solid #29465f}.p{padding:14px}.ctrl{margin-bottom:13px}.ctrl label{display:flex;justify-content:space-between;font-size:13px}.v{color:#31d6c5;font-weight:700}input,select{width:100%;accent-color:#31d6c5}select,button{background:#102b45;color:#fff;border:1px solid #315572;border-radius:9px;padding:9px}.sim{height:500px;background:#081725;position:relative}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:11px;display:flex;gap:7px;flex-wrap:wrap}.badge{position:absolute;top:10px;left:10px;background:#06131ddd;border:1px solid #315572;padding:7px;border-radius:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:9px;padding:9px}.stat small{display:block;color:#9db5cb}.formula{margin-top:10px;padding:10px;background:#081927;border-left:3px solid #31d6c5;border-radius:8px;font:12px Consolas;line-height:1.6}.chart{height:220px;margin-top:10px}.tbl{max-height:145px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}td,th{padding:6px;border-bottom:1px solid #24445f;text-align:right}@media(max-width:1050px){.grid{grid-template-columns:285px 1fr}.right{grid-column:1/-1}}@media(max-width:700px){.grid{grid-template-columns:1fr}.right{grid-column:auto}}</style></head><body><div class=app><h1>65 — Tachometer & Rotational Speed Measurement</h1><div class=sub>Optical/magnetic tachometer • RPM • pulse frequency • period • angular velocity</div><div class=grid><div class=card><div class=hd>Parameters</div><div class=p><div class=ctrl><label>Rotational speed <span class=v id=rv></span></label><input id=rpm type=range min=0 max=6000 value=1500 step=25></div><div class=ctrl><label>Pulses per revolution <span class=v id=pv></span></label><input id=ppr type=range min=1 max=60 value=4></div><div class=ctrl><label>Sensor threshold <span class=v id=tv></span></label><input id=thr type=range min=.1 max=.9 value=.5 step=.05></div></div></div><div class=card><div class=hd>Rotating Shaft & Pulse Pickup</div><div class=sim><canvas id=c></canvas><div class=badge>Pulse: <b id=pn></b></div></div><div class=bar><button id=play>▶ Run</button><button id=pause>⏸ Pause</button><button id=stop>■ Stop</button><button id=record>＋ Record</button><button id=csv>CSV</button></div></div><div class="card right"><div class=hd>Analysis</div><div class=p><div class=stats><div class=stat><small>Speed</small><b id=RPM></b></div><div class=stat><small>Angular velocity</small><b id=W></b></div><div class=stat><small>Pulse frequency</small><b id=FP></b></div><div class=stat><small>Pulse period</small><b id=TP></b></div></div><div class=formula>ω = 2πN/60<br>f_pulse = N·PPR/60<br>T_pulse = 1/f_pulse</div><div class=chart><canvas id=g></canvas></div><div class=tbl><table><thead><tr><th>#</th><th>RPM</th><th>PPR</th><th>Hz</th></tr></thead><tbody id=tb></tbody></table></div></div></div></div></div><script>
const $=i=>document.getElementById(i),c=$('c'),x=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let run=true,a=0,last=performance.now(),rows=[];
function q(R=null){let rpm=R===null?+$('rpm').value:R,ppr=+$('ppr').value,thr=+$('thr').value,w=2*Math.PI*rpm/60,fp=rpm*ppr/60,tp=fp?1/fp:0;return{rpm,ppr,thr,w,fp,tp}}
function u(){let z=q();$('rv').textContent=z.rpm+' rpm';$('pv').textContent=z.ppr;$('tv').textContent=z.thr.toFixed(2);$('RPM').textContent=z.rpm+' rpm';$('W').textContent=z.w.toFixed(2)+' rad/s';$('FP').textContent=z.fp.toFixed(2)+' Hz';$('TP').textContent=z.fp?(z.tp*1000).toFixed(3)+' ms':'—';draw();chart()}
function size(){let d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);r=g.getBoundingClientRect();g.width=r.width*d;g.height=r.height*d;gx.setTransform(d,0,0,d,0,0);u()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),cx=W*.45,cy=H/2,R=145;x.clearRect(0,0,W,H);x.fillStyle='#173b58';x.beginPath();x.arc(cx,cy,R,0,7);x.fill();for(let i=0;i<z.ppr;i++){let aa=a+i*2*Math.PI/z.ppr;x.strokeStyle='#ffd166';x.lineWidth=5;x.beginPath();x.moveTo(cx+Math.cos(aa)*(R-25),cy+Math.sin(aa)*(R-25));x.lineTo(cx+Math.cos(aa)*R,cy+Math.sin(aa)*R);x.stroke()}x.fillStyle='#31d6c5';x.fillRect(W*.78,cy-40,45,80);let phase=((a%(2*Math.PI/z.ppr))+(2*Math.PI/z.ppr))%(2*Math.PI/z.ppr),pulse=Math.cos(phase*z.ppr)>z.thr;$('pn').textContent=pulse?'HIGH':'LOW';x.fillStyle='#eef7ff';x.fillText('Pickup',W*.77,cy+65)}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=28,z=q();gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,H-25);gx.lineTo(W-8,H-25);gx.stroke();gx.strokeStyle='#31d6c5';gx.beginPath();for(let i=0;i<=100;i++){let R=i*60,F=q(R).fp,X=p+i/100*(W-p-10),Y=H-25-F/Math.max(1,q(6000).fp)*(H-45);i?gx.lineTo(X,Y):gx.moveTo(X,Y)}gx.stroke();gx.fillStyle='#eef7ff';gx.fillText('Pulse frequency vs RPM',p,13)}
function loop(n){let dt=Math.min((n-last)/1000,.03);last=n;if(run){a+=q().w*dt;draw()}requestAnimationFrame(loop)}$('play').onclick=()=>run=true;$('pause').onclick=()=>run=false;$('stop').onclick=()=>{$('rpm').value=0;run=false;u()};['rpm','ppr','thr'].forEach(i=>$(i).oninput=u);$('record').onclick=()=>{let z=q();rows.push(z);$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.rpm}</td><td>${r.ppr}</td><td>${r.fp.toFixed(2)}</td></tr>`).join('')};$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='rpm,ppr,omega_rad_s,pulse_Hz,period_s\n'+rows.map(r=>[r.rpm,r.ppr,r.w,r.fp,r.tp].join(',')).join('\n'),A=document.createElement('a');A.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));A.download='tachometer.csv';A.click()};new ResizeObserver(size).observe(document.body);u();requestAnimationFrame(loop)</script></body></html>
