<!doctype html><html lang=id><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>87 — Supercapacitor Energy Storage & RC Dynamics</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#071525;color:#eef7ff}.app{max-width:1450px;margin:auto;padding:18px}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:300px 1fr 355px;gap:14px}.card{background:#0d2237;border:1px solid #29465f;border-radius:17px;overflow:hidden}.hd{padding:13px 15px;font-weight:800;border-bottom:1px solid #29465f}.p{padding:14px}.ctrl{margin-bottom:13px}.ctrl label{display:flex;justify-content:space-between;font-size:13px}.v{color:#31d6c5;font-weight:700}input,select{width:100%;accent-color:#31d6c5}select,button{background:#102b45;color:#fff;border:1px solid #315572;border-radius:9px;padding:9px}.sim{height:500px;background:#081725;position:relative}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:11px;display:flex;gap:7px;flex-wrap:wrap}.badgebox{position:absolute;top:10px;left:10px;display:flex;gap:6px}.badge{background:#06131ddd;border:1px solid #315572;padding:7px;border-radius:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:9px;padding:9px}.stat small{display:block;color:#9db5cb}.formula{margin-top:10px;padding:10px;background:#081927;border-left:3px solid #31d6c5;border-radius:8px;font:12px Consolas;line-height:1.6}.chart{height:220px;margin-top:10px}.tbl{max-height:145px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}td,th{padding:6px;border-bottom:1px solid #24445f;text-align:right}@media(max-width:1050px){.grid{grid-template-columns:285px 1fr}.right{grid-column:1/-1}}@media(max-width:700px){.grid{grid-template-columns:1fr}.right{grid-column:auto}}</style></head><body><div class=app><h1>87 — Supercapacitor Energy Storage & RC Dynamics</h1><div class=sub>Charge/discharge dynamics • ESR • time constant • stored electrostatic energy</div><div class=grid><div class=card><div class=hd>Parameters</div><div class=p><div class=ctrl><label>Capacitance <span class=v id=cv></span></label><input id=C type=range min=1 max=100 value=25 step=1></div><div class=ctrl><label>Source voltage <span class=v id=sv></span></label><input id=Vs type=range min=5 max=60 value=24 step=1></div><div class=ctrl><label>Series resistance <span class=v id=rv></span></label><input id=R type=range min=.1 max=10 value=1 step=.1></div><div class=ctrl><label>Mode <span class=v id=mv>Charge</span></label><select id=mode><option value=charge>Charge</option><option value=discharge>Discharge</option></select></div></div></div><div class=card><div class=hd>Interactive Visualization</div><div class=sim><canvas id=c></canvas><div class=badgebox><span class=badge id=b1></span> <span class=badge id=b2></span></div></div><div class=bar><button id=run>▶ Run</button><button id=pause>⏸ Pause</button><button id=special>↺ Reset</button><button id=dist>⚡ Step</button><button id=record>＋ Record</button><button id=csv>CSV</button></div></div><div class="card right"><div class=hd>Analysis</div><div class=p><div class=stats><div class=stat><small>Capacitor voltage</small><b id=VC></b></div><div class=stat><small>Current</small><b id=I></b></div><div class=stat><small>Stored energy</small><b id=E></b></div><div class=stat><small>Time constant</small><b id=TAU></b></div></div><div class=formula>τ=RC<br>I=(Vs−Vc)/R (charge)<br>I=−Vc/R (discharge)<br>E=½CV²</div><div class=chart><canvas id=g></canvas></div><div class=tbl><table><thead><tr><th>#</th><th>Input</th><th>State</th><th>Output</th></tr></thead><tbody id=tb></tbody></table></div></div></div></div></div><script>const $=i=>document.getElementById(i),c=$('c'),x=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let active=true,last=performance.now(),vc=0,rows=[],hist=[];
function q(){let C=+$('C').value,Vs=+$('Vs').value,R=+$('R').value,mode=$('mode').value,I=mode==='charge'?(Vs-vc)/R:-vc/R,E=.5*C*vc*vc,tau=R*C;return{C,Vs,R,mode,I,E,tau}}
function u(){let z=q();$('cv').textContent=z.C+' F';$('sv').textContent=z.Vs+' V';$('rv').textContent=z.R.toFixed(1)+' Ω';$('mv').textContent=z.mode==='charge'?'Charge':'Discharge';$('VC').textContent=vc.toFixed(2)+' V';$('I').textContent=z.I.toFixed(2)+' A';$('E').textContent=z.E.toFixed(1)+' J';$('TAU').textContent=z.tau.toFixed(1)+' s';draw();chart()}
function size(){let d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);r=g.getBoundingClientRect();g.width=r.width*d;g.height=r.height*d;gx.setTransform(d,0,0,d,0,0);u()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),cx=W*.5,cy=H*.48;x.clearRect(0,0,W,H);x.strokeStyle='#58a8ff';x.lineWidth=7;x.beginPath();x.moveTo(cx-30,cy-100);x.lineTo(cx-30,cy+100);x.moveTo(cx+30,cy-100);x.lineTo(cx+30,cy+100);x.stroke();let f=Math.min(1,vc/Math.max(1,z.Vs));x.fillStyle='#31d6c5';x.fillRect(cx-100,cy+150-f*230,200,f*230);x.strokeStyle='#eef7ff';x.strokeRect(cx-100,cy-80,200,230);x.fillStyle='#eef7ff';x.fillText('SUPERCAPACITOR',cx-65,cy+175);$('b1').textContent=z.mode.toUpperCase();$('b2').textContent='E '+z.E.toFixed(0)+' J'}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=28,z=q();gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,H-25);gx.lineTo(W-8,H-25);gx.stroke();gx.strokeStyle='#31d6c5';gx.beginPath();hist.forEach((h,i)=>{let X=p+i/299*(W-p-10),Y=H-25-h/Math.max(1,z.Vs)*(H-45);i?gx.lineTo(X,Y):gx.moveTo(X,Y)});gx.stroke();gx.fillStyle='#eef7ff';gx.fillText('Capacitor voltage history',p,13)}
function loop(n){let dt=Math.min((n-last)/1000,.08);last=n;if(active){let z=q();vc+=z.I/z.C*dt;vc=Math.max(0,Math.min(z.Vs,vc));hist.push(vc);if(hist.length>300)hist.shift();u()}requestAnimationFrame(loop)}
$('run').onclick=()=>active=true;$('pause').onclick=()=>active=!active;$('special').onclick=()=>{vc=0;hist=[];active=false;u()};$('dist').onclick=()=>{$('mode').value=$('mode').value==='charge'?'discharge':'charge';u()};['C','Vs','R','mode'].forEach(i=>$(i).oninput=u);$('record').onclick=()=>{let z=q();rows.push({...z,vc});$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.C} F</td><td>${r.mode}</td><td>${r.vc.toFixed(2)} V</td></tr>`).join('')};$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='C_F,Vs_V,R_ohm,mode,Vc_V,current_A,energy_J,tau_s\n'+rows.map(r=>[r.C,r.Vs,r.R,r.mode,r.vc,r.I,r.E,r.tau].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='supercapacitor_rc.csv';a.click()};new ResizeObserver(size).observe(document.body);u();requestAnimationFrame(loop)</script></body></html>
