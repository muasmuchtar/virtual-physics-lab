<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electric Potential & Capacitors</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#06101d,#091827);color:#eef7ff}.app{max-width:1500px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{margin:0}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:310px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #24445f;border-radius:18px;overflow:hidden}.ch{padding:14px 16px;border-bottom:1px solid #24445f;font-weight:800}.cb{padding:15px}.ctrl{margin-bottom:14px}.ctrl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:#31d6c5;font-weight:800}input[type=range]{width:100%;accent-color:#31d6c5}select,button{background:#102b45;border:1px solid #315572;color:white;padding:9px 12px;border-radius:10px;cursor:pointer}select{width:100%}.sim{height:540px;position:relative;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}.badge{background:#06131ddd;border:1px solid #315572;padding:7px 9px;border-radius:9px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:11px;padding:10px}.stat small{display:block;color:#9db5cb}.stat strong{font-size:18px}.formula{margin-top:12px;border-left:3px solid #31d6c5;background:#081927;padding:11px;border-radius:9px;font-family:Consolas,monospace;line-height:1.6;font-size:12px}.chart{height:235px;margin-top:12px}.table{max-height:210px;overflow:auto;margin-top:12px;border:1px solid #24445f;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #1a354d;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:1100px){.grid{grid-template-columns:290px 1fr}.right{grid-column:1/-1}}@media(max-width:720px){.grid{grid-template-columns:1fr}.right{grid-column:auto}.head{flex-direction:column;align-items:flex-start}.sim{height:450px}}
</style>
</head><body><div class="app">
<div class="head"><div><h1>23 — Electric Potential & Capacitors</h1><div class="sub">Parallel-Plate Capacitor • Charge • Energy • Dielectric</div></div><button id="csv">Export CSV</button></div>
<div class="grid">
<section class="card"><div class="ch">Parameter</div><div class="cb">
<div class="ctrl"><label>Luas pelat A <span class="val" id="Av"></span></label><input id="A" type="range" min=".001" max=".1" value=".02" step=".001"></div>
<div class="ctrl"><label>Jarak pelat d <span class="val" id="dv"></span></label><input id="d" type="range" min=".5" max="10" value="2" step=".1"></div>
<div class="ctrl"><label>Tegangan V <span class="val" id="Vv"></span></label><input id="V" type="range" min="1" max="500" value="120" step="1"></div>
<div class="ctrl"><label>Konstanta dielektrik κ <span class="val" id="kv"></span></label><input id="kap" type="range" min="1" max="10" value="1" step=".1"></div>
</div></section>
<section class="card"><div class="ch">Capacitor Simulation</div><div class="sim"><canvas id="c"></canvas><div class="badges"><div class="badge">C=<span id="cn"></span> nF</div><div class="badge">Q=<span id="qn"></span> μC</div><div class="badge">E=<span id="en"></span> V/m</div></div></div>
<div class="bar"><button id="charge">⚡ Charge</button><button id="discharge">⏬ Discharge</button><button id="record">＋ Record</button><button id="reset">↺ Reset</button></div></section>
<section class="card right"><div class="ch">Analisis</div><div class="cb"><div class="stats">
<div class="stat"><small>Capacitance</small><strong id="C"></strong></div><div class="stat"><small>Charge</small><strong id="Q"></strong></div><div class="stat"><small>Energy</small><strong id="U"></strong></div><div class="stat"><small>Electric field</small><strong id="E"></strong></div></div>
<div class="formula">C = κε₀A/d<br>Q = CV<br>U = ½CV²<br>E = V/d</div>
<div class="chart"><canvas id="g"></canvas></div><div class="table"><table><thead><tr><th>#</th><th>A</th><th>d mm</th><th>κ</th><th>V</th><th>C nF</th></tr></thead><tbody id="tb"></tbody></table></div></div></section>
</div></div><script>
const $=i=>document.getElementById(i),eps0=8.8541878128e-12,c=$('c'),ctx=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let level=1,rows=[];
function q(){let A=+$('A').value,d=+$('d').value/1000,V=+$('V').value,kap=+$('kap').value,C=kap*eps0*A/d,Q=C*V,U=.5*C*V*V,E=V/d;return{A,d,V,kap,C,Q,U,E}}
function resize(){let D=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*D;c.height=r.height*D;ctx.setTransform(D,0,0,D,0,0);r=g.getBoundingClientRect();g.width=r.width*D;g.height=r.height*D;gx.setTransform(D,0,0,D,0,0);draw();chart()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),cx=W/2,cy=H/2,gap=40+z.d/.01*120,plateH=Math.min(260,100+z.A/.1*170);ctx.clearRect(0,0,W,H);ctx.fillStyle='#ff758f';ctx.fillRect(cx-gap/2-14,cy-plateH/2,14,plateH);ctx.fillStyle='#58a8ff';ctx.fillRect(cx+gap/2,cy-plateH/2,14,plateH);if(z.kap>1){ctx.fillStyle='#31d6c533';ctx.fillRect(cx-gap/2,cy-plateH/2,gap,plateH)}for(let i=0;i<8;i++){let y=cy-plateH/2+20+i*(plateH-40)/7;ctx.strokeStyle='#ffd166aa';ctx.beginPath();ctx.moveTo(cx-gap/2+4,y);ctx.lineTo(cx+gap/2-4,y);ctx.stroke()}ctx.fillStyle='#eef7ff';ctx.font='bold 18px Segoe UI';ctx.fillText('+',cx-gap/2-10,cy);ctx.fillText('−',cx+gap/2+2,cy);$('cn').textContent=(z.C*1e9).toFixed(2);$('qn').textContent=(z.Q*1e6*level).toFixed(2);$('en').textContent=(z.E*level).toExponential(2)}
function update(){let z=q();$('Av').textContent=z.A.toFixed(3)+' m²';$('dv').textContent=(z.d*1000).toFixed(1)+' mm';$('Vv').textContent=z.V+' V';$('kv').textContent=z.kap.toFixed(1);$('C').textContent=(z.C*1e9).toFixed(2)+' nF';$('Q').textContent=(z.Q*1e6).toFixed(2)+' μC';$('U').textContent=(z.U*1000).toFixed(3)+' mJ';$('E').textContent=z.E.toExponential(2)+' V/m';draw();chart()}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=30,z=q();gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,10);gx.lineTo(p,H-p);gx.lineTo(W-10,H-p);gx.stroke();gx.strokeStyle='#31d6c5';gx.beginPath();for(let i=0;i<=100;i++){let d=.0005+i*.000095,C=z.kap*eps0*z.A/d*1e9,X=p+i/100*(W-p-12),Y=H-p-Math.min(1,C/400)*(H-p-18);if(i)gx.lineTo(X,Y);else gx.moveTo(X,Y)}gx.stroke()}
$('charge').onclick=()=>{level=1;draw()};$('discharge').onclick=()=>{level=0;draw()};$('reset').onclick=()=>{$('A').value=.02;$('d').value=2;$('V').value=120;$('kap').value=1;level=1;update()};['A','d','V','kap'].forEach(i=>$(i).oninput=update);
$('record').onclick=()=>{let z=q();rows.push(z);$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.A.toFixed(3)}</td><td>${(r.d*1000).toFixed(1)}</td><td>${r.kap}</td><td>${r.V}</td><td>${(r.C*1e9).toFixed(2)}</td></tr>`).join('')};
$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='No,A_m2,d_mm,kappa,V,C_nF,Q_uC,U_J\n'+rows.map((r,i)=>[i+1,r.A,r.d*1000,r.kap,r.V,r.C*1e9,r.Q*1e6,r.U].join(',')).join('\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='capacitor_data.csv';a.click()};
new ResizeObserver(resize).observe(document.body);update();
</script></body></html>
