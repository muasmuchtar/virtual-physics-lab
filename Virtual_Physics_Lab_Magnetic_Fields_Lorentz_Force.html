<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magnetic Fields & Lorentz Force</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#06101d,#091827);color:#eef7ff}.app{max-width:1500px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{margin:0}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:310px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #24445f;border-radius:18px;overflow:hidden}.ch{padding:14px 16px;border-bottom:1px solid #24445f;font-weight:800}.cb{padding:15px}.ctrl{margin-bottom:14px}.ctrl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:#31d6c5;font-weight:800}input[type=range]{width:100%;accent-color:#31d6c5}select,button{background:#102b45;border:1px solid #315572;color:white;padding:9px 12px;border-radius:10px;cursor:pointer}select{width:100%}.sim{height:540px;position:relative;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}.badge{background:#06131ddd;border:1px solid #315572;padding:7px 9px;border-radius:9px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:11px;padding:10px}.stat small{display:block;color:#9db5cb}.stat strong{font-size:18px}.formula{margin-top:12px;border-left:3px solid #31d6c5;background:#081927;padding:11px;border-radius:9px;font-family:Consolas,monospace;line-height:1.6;font-size:12px}.chart{height:235px;margin-top:12px}.table{max-height:210px;overflow:auto;margin-top:12px;border:1px solid #24445f;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #1a354d;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:1100px){.grid{grid-template-columns:290px 1fr}.right{grid-column:1/-1}}@media(max-width:720px){.grid{grid-template-columns:1fr}.right{grid-column:auto}.head{flex-direction:column;align-items:flex-start}.sim{height:450px}}</style></head><body><div class="app"><div class="head"><div><h1>25 — Magnetic Fields & Lorentz Force</h1><div class="sub">Charged Particle • Uniform Magnetic Field • Circular Motion</div></div><button id="csv">Export CSV</button></div><div class="grid">
<section class="card"><div class="ch">Parameter</div><div class="cb">
<div class="ctrl"><label>Muatan q <span class="val" id="qv"></span></label><input id="q" type="range" min="-5" max="5" value="1" step=".5"></div>
<div class="ctrl"><label>Massa m <span class="val" id="mv"></span></label><input id="m" type="range" min="1" max="10" value="2" step=".5"></div>
<div class="ctrl"><label>Kecepatan v <span class="val" id="vv"></span></label><input id="v" type="range" min="1" max="20" value="8" step=".5"></div>
<div class="ctrl"><label>Medan B <span class="val" id="bv"></span></label><input id="B" type="range" min=".1" max="3" value="1" step=".1"></div>
<div class="ctrl"><label>Sudut v–B <span class="val" id="av"></span></label><input id="a" type="range" min="0" max="90" value="90" step="1"></div></div></section>
<section class="card"><div class="ch">Particle Simulation</div><div class="sim"><canvas id="c"></canvas><div class="badges"><div class="badge">F=<span id="fn"></span></div><div class="badge">r=<span id="rn"></span></div><div class="badge">T=<span id="tn"></span></div></div></div><div class="bar"><button id="play">▶ Play</button><button id="pause">⏸ Pause</button><button id="reset">↺ Reset</button><button id="record">＋ Record</button></div></section>
<section class="card right"><div class="ch">Analisis</div><div class="cb"><div class="stats"><div class="stat"><small>Lorentz force</small><strong id="F"></strong></div><div class="stat"><small>Orbit radius</small><strong id="R"></strong></div><div class="stat"><small>Cyclotron period</small><strong id="T"></strong></div><div class="stat"><small>Direction</small><strong id="dir"></strong></div></div><div class="formula">F = |q|vB sinθ<br>r = mv⊥/(|q|B)<br>T = 2πm/(|q|B)<br>Direction: q(v × B)</div><div class="chart"><canvas id="g"></canvas></div><div class="table"><table><thead><tr><th>#</th><th>q</th><th>v</th><th>B</th><th>F</th><th>r</th></tr></thead><tbody id="tb"></tbody></table></div></div></section></div></div>
<script>
const $=i=>document.getElementById(i),c=$('c'),x=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let run=true,t=0,last=performance.now(),rows=[];
function q(){let Q=+$('q').value,M=+$('m').value,V=+$('v').value,B=+$('B').value,a=+$('a').value*Math.PI/180,s=Math.sin(a),F=Math.abs(Q)*V*B*s,R=Math.abs(Q)>1e-9&&s>1e-6?M*V*s/(Math.abs(Q)*B):Infinity,T=Math.abs(Q)>1e-9?2*Math.PI*M/(Math.abs(Q)*B):Infinity;return{Q,M,V,B,a,F,R,T}}
function resize(){let D=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*D;c.height=r.height*D;x.setTransform(D,0,0,D,0,0);r=g.getBoundingClientRect();g.width=r.width*D;g.height=r.height*D;gx.setTransform(D,0,0,D,0,0);draw();chart()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q();x.clearRect(0,0,W,H);x.fillStyle='#8fb6d3';x.font='20px Segoe UI';for(let yy=70;yy<H-40;yy+=55)for(let xx=55;xx<W-40;xx+=55)x.fillText('×',xx,yy);let rr=isFinite(z.R)?Math.max(45,Math.min(170,z.R*18)):0,cx=W/2,cy=H/2,ang=(isFinite(z.T)?2*Math.PI*t/z.T:0)*(z.Q>=0?1:-1),px=isFinite(z.R)?cx+rr*Math.cos(ang):cx-160+t*z.V*8,py=isFinite(z.R)?cy+rr*Math.sin(ang):cy;x.strokeStyle='#31d6c566';if(isFinite(z.R)){x.beginPath();x.arc(cx,cy,rr,0,7);x.stroke()}x.fillStyle=z.Q>=0?'#ff758f':'#58a8ff';x.beginPath();x.arc(px,py,13,0,7);x.fill();x.fillStyle='#fff';x.fillText(z.Q>=0?'+':'−',px-5,py+6);$('fn').textContent=z.F.toFixed(2)+' N';$('rn').textContent=isFinite(z.R)?z.R.toFixed(2)+' m':'∞';$('tn').textContent=isFinite(z.T)?z.T.toFixed(2)+' s':'∞'}
function update(){let z=q();$('qv').textContent=z.Q+' μC';$('mv').textContent=z.M+' arb.';$('vv').textContent=z.V+' m/s';$('bv').textContent=z.B+' T';$('av').textContent=(z.a*180/Math.PI).toFixed(0)+'°';$('F').textContent=z.F.toFixed(2)+' (scaled)';$('R').textContent=isFinite(z.R)?z.R.toFixed(2)+' (scaled)':'∞';$('T').textContent=isFinite(z.T)?z.T.toFixed(2)+' (scaled)':'∞';$('dir').textContent=z.Q>=0?'Right-hand rule':'Opposite RH rule';draw();chart()}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=30,z=q();gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,10);gx.lineTo(p,H-p);gx.lineTo(W-10,H-p);gx.stroke();gx.strokeStyle='#31d6c5';gx.beginPath();for(let i=0;i<=100;i++){let B=.1+i*.029,F=Math.abs(z.Q)*z.V*B*Math.sin(z.a),X=p+i/100*(W-p-12),Y=H-p-Math.min(1,F/300)*(H-p-18);if(i)gx.lineTo(X,Y);else gx.moveTo(X,Y)}gx.stroke()}
function loop(n){let dt=Math.min((n-last)/1000,.04);last=n;if(run){t+=dt;draw()}requestAnimationFrame(loop)}$('play').onclick=()=>run=true;$('pause').onclick=()=>run=!run;$('reset').onclick=()=>{t=0;run=true;draw()};['q','m','v','B','a'].forEach(i=>$(i).oninput=update);$('record').onclick=()=>{let z=q();rows.push(z);$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.Q}</td><td>${r.V}</td><td>${r.B}</td><td>${r.F.toFixed(2)}</td><td>${isFinite(r.R)?r.R.toFixed(2):'∞'}</td></tr>`).join('')};$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='No,q,v,B,F,r\n'+rows.map((r,i)=>[i+1,r.Q,r.V,r.B,r.F,r.R].join(',')).join('\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lorentz_force.csv';a.click()};new ResizeObserver(resize).observe(document.body);update();requestAnimationFrame(loop);
</script></body></html>
