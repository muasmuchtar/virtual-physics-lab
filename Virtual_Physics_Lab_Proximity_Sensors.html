<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Proximity Sensors</title><style>*{box-sizing:border-box}body{margin:0;font:15px Segoe UI;background:#071525;color:#eef7ff}.app{max-width:1400px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:300px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #29465f;border-radius:16px;overflow:hidden}.p{padding:14px}.sim{height:500px;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%}input,select{width:100%}label{display:block;margin:12px 0 4px}.v{color:#31d6c5}.bar{display:flex;gap:8px;padding:12px;flex-wrap:wrap}button,select{background:#102b45;color:white;border:1px solid #315572;border-radius:8px;padding:8px}.chart{height:220px}.stat{padding:9px;background:#081a2a;margin:7px 0;border-radius:8px}.formula{padding:10px;background:#081927;border-left:3px solid #31d6c5;font-family:Consolas}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><div class=app><h1>57 — Proximity Sensors: Inductive, Capacitive & Photoelectric</h1><p>Detection range • target material • switching state • sensor response</p><div class=grid><div class=card><div class=p><label>Sensor type</label><select id=type><option>Inductive</option><option>Capacitive</option><option>Photoelectric</option></select><label>Target distance <span class=v id=dv></span></label><input id=d type=range min=0 max=100 value=35><label>Nominal sensing range <span class=v id=rv></span></label><input id=r type=range min=5 max=80 value=40><label>Target factor <span class=v id=fv></span></label><input id=f type=range min=.3 max=1.5 value=1 step=.05></div></div><div class=card><div class=sim><canvas id=c></canvas></div><div class=bar><button id=play>▶ Move Target</button><button id=pause>⏸ Pause</button><button id=record>＋ Record</button></div></div><div class=card><div class=p><div class=stat>Effective range: <b id=er></b></div><div class=stat>Output: <b id=out></b></div><div class=stat>Normalized response: <b id=res></b></div><div class=formula>R_eff = R_nom × target factor<br>Detected when distance ≤ R_eff<br>Response ≈ exp(−distance/R_eff)</div><div class=chart><canvas id=g></canvas></div><div id=log></div></div></div></div></div><script>
const $=i=>document.getElementById(i),c=$('c'),x=c.getContext('2d'),g=$('g'),gx=g.getContext('2d');let run=false,t=0,last=performance.now(),rows=[];
function q(D=null){let d=D===null?+$('d').value:D,r=+$('r').value,f=+$('f').value,type=$('type').value,er=r*f,resp=Math.exp(-d/Math.max(er,1)),on=d<=er;return{d,r,f,type,er,resp,on}}
function u(){let z=q();$('dv').textContent=z.d.toFixed(0)+' mm';$('rv').textContent=z.r+' mm';$('fv').textContent=z.f.toFixed(2);$('er').textContent=z.er.toFixed(1)+' mm';$('out').textContent=z.on?'ON — TARGET DETECTED':'OFF';$('res').textContent=(z.resp*100).toFixed(1)+'%';draw();chart()}
function size(){let d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);r=g.getBoundingClientRect();g.width=r.width*d;g.height=r.height*d;gx.setTransform(d,0,0,d,0,0);u()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),sx=100,tx=sx+100+z.d*5;x.clearRect(0,0,W,H);x.fillStyle='#173b58';x.fillRect(sx,H/2-55,100,110);x.fillStyle='#eef7ff';x.fillText(z.type+' sensor',sx,H/2-75);x.strokeStyle=z.on?'#31d6c5':'#ff758f';x.lineWidth=3;for(let i=1;i<=4;i++){x.beginPath();x.arc(sx+100,H/2,i*z.er*.8,-1,1);x.stroke()}x.fillStyle=z.type==='Inductive'?'#b8c6d1':'#ffd166';x.fillRect(Math.min(tx,W-90),H/2-70,60,140);x.fillStyle='#eef7ff';x.fillText('TARGET',Math.min(tx,W-90),H/2+95)}
function chart(){let W=g.clientWidth,H=g.clientHeight,p=25,z=q();gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(p,H-25);gx.lineTo(W-8,H-25);gx.stroke();gx.strokeStyle='#31d6c5';gx.beginPath();for(let i=0;i<=100;i++){let v=q(i).resp,X=p+i/100*(W-p-10),Y=H-25-v*(H-45);i?gx.lineTo(X,Y):gx.moveTo(X,Y)}gx.stroke();gx.fillStyle='#ffd166';gx.beginPath();gx.arc(p+z.d/100*(W-p-10),H-25-z.resp*(H-45),5,0,7);gx.fill()}
function loop(n){let dt=Math.min((n-last)/1000,.05);last=n;if(run){t+=dt;$('d').value=50+48*Math.sin(t);u()}requestAnimationFrame(loop)}$('play').onclick=()=>run=true;$('pause').onclick=()=>run=!run;['type','d','r','f'].forEach(i=>$(i).oninput=u);$('record').onclick=()=>{let z=q();rows.push(z);$('log').innerHTML='Records: '+rows.length};new ResizeObserver(size).observe(document.body);u();requestAnimationFrame(loop)</script></body></html>
