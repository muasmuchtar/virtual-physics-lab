<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>de Broglie Matter Waves</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#06101d,#091827);color:#eef7ff}.app{max-width:1500px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{margin:0}.sub{color:#9db5cb}.grid{display:grid;grid-template-columns:310px 1fr 350px;gap:14px}.card{background:#0d2237;border:1px solid #24445f;border-radius:18px;overflow:hidden}.ch{padding:14px 16px;border-bottom:1px solid #24445f;font-weight:800}.cb{padding:15px}.ctrl{margin-bottom:14px}.ctrl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:#31d6c5;font-weight:800}input[type=range]{width:100%;accent-color:#31d6c5}select,button{background:#102b45;border:1px solid #315572;color:white;padding:9px 12px;border-radius:10px;cursor:pointer}select{width:100%}.sim{height:540px;position:relative;background:#081725}.sim canvas,.chart canvas{width:100%;height:100%;display:block}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}.badge{background:#06131ddd;border:1px solid #315572;padding:7px 9px;border-radius:9px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#081a2a;border:1px solid #24445f;border-radius:11px;padding:10px}.stat small{display:block;color:#9db5cb}.stat strong{font-size:18px}.formula{margin-top:12px;border-left:3px solid #31d6c5;background:#081927;padding:11px;border-radius:9px;font-family:Consolas,monospace;line-height:1.6;font-size:12px}.chart{height:235px;margin-top:12px}.table{max-height:210px;overflow:auto;margin-top:12px;border:1px solid #24445f;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #1a354d;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:1100px){.grid{grid-template-columns:290px 1fr}.right{grid-column:1/-1}}@media(max-width:720px){.grid{grid-template-columns:1fr}.right{grid-column:auto}.head{flex-direction:column;align-items:flex-start}.sim{height:450px}}</style></head><body><div class="app"><div class="head"><div><h1>33 — de Broglie Wavelength & Matter Waves</h1><div class="sub">Dualitas Gelombang-Partikel • Momentum • Electron Diffraction</div></div><button id="csv">Export CSV</button></div><div class="grid">
<section class="card"><div class="ch">Parameter</div><div class="cb">
<div class="ctrl"><label>Partikel</label><select id="particle"><option value="e">Electron</option><option value="p">Proton</option><option value="n">Neutron</option></select></div>
<div class="ctrl"><label>Kecepatan v <span class="val" id="vv"></span></label><input id="v" type="range" min="0.1" max="30" value="5" step=".1"></div>
<div class="ctrl"><label>Animation speed <span class="val" id="sv"></span></label><input id="sp" type="range" min=".2" max="3" value="1" step=".1"></div></div></section>
<section class="card"><div class="ch">Matter-Wave Visualization</div><div class="sim"><canvas id="c"></canvas><div class="badges"><div class="badge">λ=<span id="ln"></span></div><div class="badge">p=<span id="pn"></span></div><div class="badge">KE=<span id="ken"></span></div></div></div><div class="bar"><button id="play">▶ Play</button><button id="pause">⏸ Pause</button><button id="reset">↺ Reset</button><button id="record">＋ Record</button></div></section>
<section class="card right"><div class="ch">Analisis</div><div class="cb"><div class="stats"><div class="stat"><small>de Broglie wavelength</small><strong id="L"></strong></div><div class="stat"><small>Momentum</small><strong id="P"></strong></div><div class="stat"><small>Kinetic energy</small><strong id="KE"></strong></div><div class="stat"><small>Wave number k</small><strong id="K"></strong></div></div><div class="formula">λ = h/p<br>p = mv (non-relativistik)<br>K = ½mv²<br>k = 2π/λ</div><div class="chart"><canvas id="g"></canvas></div><div class="table"><table><thead><tr><th>#</th><th>Partikel</th><th>v</th><th>λ</th><th>KE</th></tr></thead><tbody id="tb"></tbody></table></div></div></section></div></div>
<script>
const $=i=>document.getElementById(i),c=$('c'),ctx=c.getContext('2d'),g=$('g'),gx=g.getContext('2d'),h=6.62607015e-34,eV=1.602176634e-19;let run=true,t=0,last=performance.now(),rows=[];const masses={e:9.1093837e-31,p:1.6726219e-27,n:1.6749275e-27},names={e:'Electron',p:'Proton',n:'Neutron'};
function q(){let id=$('particle').value,m=masses[id],v=+$('v').value*1e6,sp=+$('sp').value,p=m*v,lam=h/p,KE=.5*m*v*v/eV,k=2*Math.PI/lam;return{id,m,v,sp,p,lam,KE,k}}
function fmtL(x){if(x>=1e-9)return(x*1e9).toFixed(3)+' nm';if(x>=1e-12)return(x*1e12).toFixed(3)+' pm';return x.toExponential(2)+' m'}
function resize(){let D=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*D;c.height=r.height*D;ctx.setTransform(D,0,0,D,0,0);r=g.getBoundingClientRect();g.width=r.width*D;g.height=r.height*D;gx.setTransform(D,0,0,D,0,0);draw();chart()}
function draw(){let W=c.clientWidth,H=c.clientHeight,z=q(),cy=H*.52;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#315572';ctx.beginPath();ctx.moveTo(30,cy);ctx.lineTo(W-25,cy);ctx.stroke();ctx.strokeStyle='#31d6c5';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=260;i++){let X=30+i/260*(W-55),phase=i/260*10*Math.PI-t*5*z.sp,Y=cy-75*Math.sin(phase);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.stroke();let px=30+(t*z.sp*100)%(W-55);ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(px,cy,10,0,7);ctx.fill();ctx.fillStyle='#eef7ff';ctx.fillText(names[z.id]+' — wave packet representation',35,45);$('ln').textContent=fmtL(z.lam);$('pn').textContent=z.p.toExponential(2)+' kg·m/s';$('ken').textContent=z.KE.toFixed(1)+' eV'}
function update(){let z=q();$('vv').textContent=(z.v/1e6).toFixed(1)+'×10⁶ m/s';$('sv').textContent=z.sp.toFixed(1)+'×';$('L').textContent=fmtL(z.lam);$('P').textContent=z.p.toExponential(3)+' kg·m/s';$('KE').textContent=z.KE.toFixed(2)+' eV';$('K').textContent=z.k.toExponential(3)+' m⁻¹';draw();chart()}
function chart(){let W=g.clientWidth,H=g.clientHeight,pad=30,z=q();gx.clearRect(0,0,W,H);gx.strokeStyle='#29465f';gx.beginPath();gx.moveTo(pad,10);gx.lineTo(pad,H-pad);gx.lineTo(W-10,H-pad);gx.stroke();let maxL=h/(z.m*.1e6);gx.strokeStyle='#ff758f';gx.beginPath();for(let i=0;i<=120;i++){let vv=(.1+i/120*29.9)*1e6,L=h/(z.m*vv),X=pad+i/120*(W-pad-12),Y=H-pad-L/maxL*(H-pad-18);i?gx.lineTo(X,Y):gx.moveTo(X,Y)}gx.stroke()}
function loop(n){let dt=Math.min((n-last)/1000,.04);last=n;if(run){t+=dt;draw()}requestAnimationFrame(loop)}$('play').onclick=()=>run=true;$('pause').onclick=()=>run=!run;$('reset').onclick=()=>{t=0;run=true;draw()};['particle','v','sp'].forEach(i=>$(i).oninput=update);$('record').onclick=()=>{let z=q();rows.push(z);$('tb').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${names[r.id]}</td><td>${(r.v/1e6).toFixed(1)}</td><td>${r.lam.toExponential(2)}</td><td>${r.KE.toFixed(1)}</td></tr>`).join('')};$('csv').onclick=()=>{if(!rows.length)$('record').click();let s='No,particle,velocity_m_s,wavelength_m,momentum_kg_m_s,KE_eV\n'+rows.map((r,i)=>[i+1,names[r.id],r.v,r.lam,r.p,r.KE].join(',')).join('\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='de_broglie_matter_waves.csv';a.click()};new ResizeObserver(resize).observe(document.body);update();requestAnimationFrame(loop);
</script></body></html>
